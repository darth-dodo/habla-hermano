id: greetings-001
title: Conversational Greetings
description: Expand your greeting skills with questions and responses
language: es
level: A1
estimated_minutes: 5
category: greetings
tags:
  - greeting
  - conversation
  - questions
  - responses
vocabulary_count: 8
icon: "👋"

steps:
  - type: instruction
    content: "Building on basic greetings, let's learn how to ask how someone is doing and respond appropriately. These phrases will help you start real conversations!"
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: "¿Cómo estás?"
        translation: "How are you? (informal)"
      - word: "¿Cómo está usted?"
        translation: "How are you? (formal)"
      - word: "¿Qué tal?"
        translation: "What's up? / How's it going?"
      - word: "Estoy bien"
        translation: "I'm fine/well"
      - word: "Muy bien"
        translation: "Very well"
      - word: "Más o menos"
        translation: "So-so"
      - word: "¿Y tú?"
        translation: "And you? (informal)"
      - word: "¿Y usted?"
        translation: "And you? (formal)"
    order: 2

  - type: example
    content: "¿Cómo estás? - Estoy muy bien, gracias. ¿Y tú?"
    translation: "How are you? - I'm very well, thank you. And you?"
    order: 3

  - type: example
    content: "Buenos días, señora López. ¿Cómo está usted?"
    translation: "Good morning, Mrs. López. How are you?"
    order: 4

  - type: tip
    content: "Use '¿Cómo estás?' with friends, family, and people your age. Use '¿Cómo está usted?' with elders, strangers, or in formal situations."
    order: 5

  - type: tip
    content: "The verb 'estar' is used for temporary states like how you feel. This is different from 'ser' which describes permanent characteristics."
    order: 6

  - type: practice
    content: "Practice your conversational greetings!"
    exercise_id: "ex-mc-greet-a1-001"
    order: 7

exercises:
  - id: ex-mc-greet-a1-001
    type: multiple_choice
    question: "How do you ask 'How are you?' informally?"
    options:
      - "¿Cómo está usted?"
      - "¿Cómo estás?"
      - "¿Qué es?"
      - "¿Dónde estás?"
    correct_index: 1
    explanation: "'¿Cómo estás?' is the informal way to ask how someone is doing. Use it with friends and family."

  - id: ex-mc-greet-a1-002
    type: multiple_choice
    question: "Which response means 'so-so'?"
    options:
      - "Muy bien"
      - "Estoy bien"
      - "Más o menos"
      - "Excelente"
    correct_index: 2
    explanation: "'Más o menos' literally means 'more or less' and is used to say you're doing so-so."

  - id: ex-fb-greet-a1-001
    type: fill_blank
    sentence_template: "¿Cómo _____? - Estoy bien, gracias."
    correct_answer: "estás"
    alternatives:
      - "estas"
    hint: "Informal 'you are' form of estar"

  - id: ex-fb-greet-a1-002
    type: fill_blank
    sentence_template: "Estoy muy _____, gracias."
    correct_answer: "bien"
    alternatives:
      - "Bien"
    hint: "The word for 'well' or 'fine'"
