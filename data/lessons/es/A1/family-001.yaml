id: family-001
title: Family Members
description: Learn to talk about your immediate family
language: es
level: A1
estimated_minutes: 5
category: family
tags:
  - family
  - relationships
  - possessives
  - basics
vocabulary_count: 8
icon: "👨‍👩‍👧‍👦"

steps:
  - type: instruction
    content: "Family is central to Spanish-speaking cultures. Let's learn the words for family members and how to use possessive adjectives to talk about your family."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: "la madre / la mamá"
        translation: "the mother / mom"
      - word: "el padre / el papá"
        translation: "the father / dad"
      - word: "los padres"
        translation: "the parents"
      - word: "el hermano"
        translation: "the brother"
      - word: "la hermana"
        translation: "the sister"
      - word: "el hijo"
        translation: "the son"
      - word: "la hija"
        translation: "the daughter"
      - word: "los hijos"
        translation: "the children/sons"
    order: 2

  - type: example
    content: "Mi madre se llama Carmen."
    translation: "My mother's name is Carmen."
    order: 3

  - type: example
    content: "Tengo dos hermanos y una hermana."
    translation: "I have two brothers and one sister."
    order: 4

  - type: tip
    content: "Use 'mi' (my), 'tu' (your informal), 'su' (his/her/your formal) before family members. These don't change for gender: 'mi padre', 'mi madre'."
    order: 5

  - type: tip
    content: "'Los hijos' can mean 'the sons' or 'the children' (mixed group). In Spanish, mixed gender groups use the masculine plural form."
    order: 6

  - type: practice
    content: "Practice talking about family!"
    exercise_id: "ex-mc-fam-a1-001"
    order: 7

exercises:
  - id: ex-mc-fam-a1-001
    type: multiple_choice
    question: "How do you say 'my father' in Spanish?"
    options:
      - "mi madre"
      - "mi padre"
      - "tu padre"
      - "el padre"
    correct_index: 1
    explanation: "'Mi padre' means 'my father'. 'Mi' is the possessive adjective for 'my'."

  - id: ex-mc-fam-a1-002
    type: multiple_choice
    question: "What does 'los hermanos' mean?"
    options:
      - "the sisters"
      - "the brothers (or siblings)"
      - "the parents"
      - "the children"
    correct_index: 1
    explanation: "'Los hermanos' means 'the brothers' or can refer to siblings of mixed genders."

  - id: ex-fb-fam-a1-001
    type: fill_blank
    sentence_template: "_____ hermana se llama Ana."
    correct_answer: "Mi"
    alternatives:
      - "mi"
    hint: "The possessive adjective for 'my'"

  - id: ex-fb-fam-a1-002
    type: fill_blank
    sentence_template: "Tengo tres _____."
    correct_answer: "hijos"
    alternatives:
      - "Hijos"
    hint: "The word for 'children' or 'sons'"
