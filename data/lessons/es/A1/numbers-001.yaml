id: numbers-001
title: Numbers 11-100
description: Learn to count from 11 to 100 in Spanish
language: es
level: A1
estimated_minutes: 6
category: numbers
tags:
  - numbers
  - counting
  - math
  - basics
vocabulary_count: 8
icon: "🔢"

steps:
  - type: instruction
    content: "Now that you know 0-10, let's expand to 100! Spanish numbers follow patterns that make them easier to learn. Pay attention to how compound numbers are formed."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: "once"
        translation: "eleven"
      - word: "doce"
        translation: "twelve"
      - word: "trece"
        translation: "thirteen"
      - word: "catorce"
        translation: "fourteen"
      - word: "quince"
        translation: "fifteen"
      - word: "veinte"
        translation: "twenty"
      - word: "treinta"
        translation: "thirty"
      - word: "cien"
        translation: "one hundred"
    order: 2

  - type: example
    content: "Tengo veintitrés años."
    translation: "I am twenty-three years old."
    order: 3

  - type: example
    content: "Son cuarenta y cinco euros."
    translation: "It's forty-five euros."
    order: 4

  - type: tip
    content: "Numbers 16-19 are formed as 'diez y seis' → 'dieciséis'. Numbers 21-29 combine: 'veinte y uno' → 'veintiuno'. From 31 onward, use 'y': treinta y uno, cuarenta y dos."
    order: 5

  - type: tip
    content: "The tens are: veinte (20), treinta (30), cuarenta (40), cincuenta (50), sesenta (60), setenta (70), ochenta (80), noventa (90), cien (100)."
    order: 6

  - type: practice
    content: "Practice your Spanish numbers!"
    exercise_id: "ex-mc-num-a1-001"
    order: 7

exercises:
  - id: ex-mc-num-a1-001
    type: multiple_choice
    question: "How do you say 'fifteen' in Spanish?"
    options:
      - "catorce"
      - "quince"
      - "dieciséis"
      - "cincuenta"
    correct_index: 1
    explanation: "'Quince' means fifteen. Numbers 11-15 each have unique names."

  - id: ex-mc-num-a1-002
    type: multiple_choice
    question: "What is 'treinta y siete'?"
    options:
      - "27"
      - "37"
      - "47"
      - "73"
    correct_index: 1
    explanation: "'Treinta y siete' means thirty-seven (30 + 7)."

  - id: ex-fb-num-a1-001
    type: fill_blank
    sentence_template: "Veinti_____ (25)"
    correct_answer: "cinco"
    alternatives:
      - "Cinco"
    hint: "The word for 'five'"

  - id: ex-fb-num-a1-002
    type: fill_blank
    sentence_template: "Cuarenta _____ dos (42)"
    correct_answer: "y"
    alternatives:
      - "Y"
    hint: "The word meaning 'and'"
