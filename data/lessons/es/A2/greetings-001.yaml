id: greetings-001
title: Greetings in Context
description: Master greetings for different social situations
language: es
level: A2
estimated_minutes: 6
category: greetings
tags:
  - greeting
  - social
  - formal
  - informal
vocabulary_count: 10
icon: "👋"

steps:
  - type: instruction
    content: "Spanish greetings vary greatly depending on the social context. In this lesson, you'll learn how to greet people appropriately at work, with friends, and in formal situations."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: "¿Qué hay de nuevo?"
        translation: "What's new?"
      - word: "¿Qué pasa?"
        translation: "What's happening? / What's up?"
      - word: "¿Qué onda?"
        translation: "What's up? (Latin America)"
      - word: "Es un placer"
        translation: "It's a pleasure"
      - word: "El gusto es mío"
        translation: "The pleasure is mine"
      - word: "Cuánto tiempo sin verte"
        translation: "Long time no see (informal)"
      - word: "Me alegro de verle"
        translation: "I'm glad to see you (formal)"
      - word: "¿Cómo le va?"
        translation: "How's it going? (formal)"
      - word: "Disculpe"
        translation: "Excuse me (formal)"
      - word: "Perdona"
        translation: "Sorry / Excuse me (informal)"
    order: 2

  - type: example
    content: "¡Hola, Juan! ¿Qué hay de nuevo? - Nada especial, ¿y tú?"
    translation: "Hi, Juan! What's new? - Nothing special, and you?"
    order: 3

  - type: example
    content: "Buenos días, señor Director. Me alegro de verle."
    translation: "Good morning, Mr. Director. I'm glad to see you."
    order: 4

  - type: tip
    content: "'¿Qué onda?' is very common in Mexico and Central America but may sound unusual in Spain. '¿Qué tal?' is universally understood."
    order: 5

  - type: tip
    content: "When meeting someone for the second time, use 'Me alegro de verte/verle' (I'm glad to see you) instead of 'Mucho gusto' which is only for first meetings."
    order: 6

  - type: practice
    content: "Practice contextual greetings!"
    exercise_id: "ex-mc-greet-a2-001"
    order: 7

exercises:
  - id: ex-mc-greet-a2-001
    type: multiple_choice
    question: "Which greeting is most appropriate for a business meeting?"
    options:
      - "¿Qué onda?"
      - "¿Qué pasa?"
      - "Es un placer conocerle"
      - "¡Hola, tío!"
    correct_index: 2
    explanation: "'Es un placer conocerle' (It's a pleasure to meet you - formal) is appropriate for business settings."

  - id: ex-fb-greet-a2-001
    type: fill_blank
    sentence_template: "¡Cuánto tiempo sin _____!"
    correct_answer: "verte"
    alternatives:
      - "verle"
    hint: "Infinitive of 'to see' with informal object pronoun"

  - id: ex-tr-greet-a2-001
    type: translate
    source_text: "What's new? Nothing special."
    target_language: "es"
    correct_translation: "¿Qué hay de nuevo? Nada especial."
    alternatives:
      - "¿Qué hay de nuevo? - Nada especial."
      - "Qué hay de nuevo? Nada especial."

  - id: ex-tr-greet-a2-002
    type: translate
    source_text: "The pleasure is mine."
    target_language: "es"
    correct_translation: "El gusto es mío."
    alternatives:
      - "El gusto es mio."
      - "El placer es mío."
