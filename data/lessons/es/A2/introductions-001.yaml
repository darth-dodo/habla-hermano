id: introductions-001
title: Introducing Others
description: Learn to introduce other people and describe relationships
language: es
level: A2
estimated_minutes: 6
category: introductions
tags:
  - introduction
  - relationships
  - third-person
  - social
vocabulary_count: 10
icon: "🙋"

steps:
  - type: instruction
    content: "Beyond introducing yourself, you'll often need to introduce others. Learn how to present people to each other and describe your relationship with them."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: "Te presento a..."
        translation: "Let me introduce you to... (informal)"
      - word: "Le presento a..."
        translation: "Let me introduce you to... (formal)"
      - word: "Este es mi amigo/a"
        translation: "This is my friend (m/f)"
      - word: "mi compañero/a de trabajo"
        translation: "my coworker (m/f)"
      - word: "mi novio/a"
        translation: "my boyfriend/girlfriend"
      - word: "mi esposo/a"
        translation: "my husband/wife"
      - word: "mi jefe/a"
        translation: "my boss (m/f)"
      - word: "Él/Ella es de..."
        translation: "He/She is from..."
      - word: "Trabaja en..."
        translation: "He/She works at..."
      - word: "Nos conocimos en..."
        translation: "We met at..."
    order: 2

  - type: example
    content: "María, te presento a Carlos. Es mi compañero de trabajo."
    translation: "María, let me introduce you to Carlos. He's my coworker."
    order: 3

  - type: example
    content: "Señor López, le presento a mi esposa, Ana. Nos conocimos en la universidad."
    translation: "Mr. López, let me introduce you to my wife, Ana. We met at university."
    order: 4

  - type: tip
    content: "Use 'Este es...' for males and 'Esta es...' for females when pointing to someone you're introducing."
    order: 5

  - type: tip
    content: "In Spain, 'novio/novia' can mean boyfriend/girlfriend or fiancé(e). Context and tone clarify the meaning."
    order: 6

  - type: practice
    content: "Practice introducing others!"
    exercise_id: "ex-mc-intro-a2-001"
    order: 7

exercises:
  - id: ex-mc-intro-a2-001
    type: multiple_choice
    question: "How do you formally introduce someone to your boss?"
    options:
      - "Te presento a mi amigo"
      - "Le presento a mi colega"
      - "Este es mi amigo"
      - "Aquí está mi amigo"
    correct_index: 1
    explanation: "'Le presento a...' uses the formal 'le' (usted) appropriate for speaking to a boss."

  - id: ex-fb-intro-a2-001
    type: fill_blank
    sentence_template: "_____ es mi hermana, se llama Laura."
    correct_answer: "Esta"
    alternatives:
      - "esta"
    hint: "Demonstrative pronoun for 'this' (feminine)"

  - id: ex-tr-intro-a2-001
    type: translate
    source_text: "Let me introduce you to my wife."
    target_language: "es"
    correct_translation: "Te presento a mi esposa."
    alternatives:
      - "Le presento a mi esposa."
      - "Te presento a mi mujer."

  - id: ex-tr-intro-a2-002
    type: translate
    source_text: "This is my coworker. He works at a bank."
    target_language: "es"
    correct_translation: "Este es mi compañero de trabajo. Trabaja en un banco."
    alternatives:
      - "Este es mi colega. Trabaja en un banco."
      - "Este es mi compañero. Trabaja en un banco."
