id: colors-001
title: Shades and Descriptions
description: Learn color shades and how to describe objects in detail
language: es
level: A2
estimated_minutes: 6
category: colors
tags:
  - colors
  - shades
  - descriptions
  - adjectives
vocabulary_count: 10
icon: "🎨"

steps:
  - type: instruction
    content: "Expand your color vocabulary with shades and learn how to describe objects with multiple adjectives. This will help you be more precise in your descriptions."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: "claro/a"
        translation: "light (color)"
      - word: "oscuro/a"
        translation: "dark (color)"
      - word: "azul claro"
        translation: "light blue"
      - word: "verde oscuro"
        translation: "dark green"
      - word: "rosa"
        translation: "pink"
      - word: "morado/violeta"
        translation: "purple/violet"
      - word: "gris"
        translation: "gray"
      - word: "dorado"
        translation: "gold/golden"
      - word: "plateado"
        translation: "silver"
      - word: "de color..."
        translation: "colored..."
    order: 2

  - type: example
    content: "Prefiero la camisa azul claro, no la azul oscuro."
    translation: "I prefer the light blue shirt, not the dark blue one."
    order: 3

  - type: example
    content: "Tiene los ojos verde oscuro y el pelo castaño."
    translation: "She has dark green eyes and brown hair."
    order: 4

  - type: tip
    content: "When combining a color with claro/oscuro, the color doesn't change for gender: 'la camisa azul claro', 'el coche azul claro'. Only claro/oscuro agrees."
    order: 5

  - type: tip
    content: "'Rosa' typically doesn't change form (la falda rosa, el vestido rosa), though some speakers say 'rosado/rosada' in Latin America."
    order: 6

  - type: practice
    content: "Practice color shades and descriptions!"
    exercise_id: "ex-mc-color-a2-001"
    order: 7

exercises:
  - id: ex-mc-color-a2-001
    type: multiple_choice
    question: "How do you say 'dark red' in Spanish?"
    options:
      - "rojo claro"
      - "rojo oscuro"
      - "oscuro rojo"
      - "rojo negro"
    correct_index: 1
    explanation: "'Rojo oscuro' - the shade word (oscuro) comes after the color in Spanish."

  - id: ex-fb-color-a2-001
    type: fill_blank
    sentence_template: "Me gusta el verde _____, no el verde claro."
    correct_answer: "oscuro"
    alternatives:
      - "Oscuro"
    hint: "The opposite of 'claro'"

  - id: ex-tr-color-a2-001
    type: translate
    source_text: "I want the light pink dress."
    target_language: "es"
    correct_translation: "Quiero el vestido rosa claro."
    alternatives:
      - "Quiero el vestido rosado claro."
      - "Me gustaría el vestido rosa claro."

  - id: ex-tr-color-a2-002
    type: translate
    source_text: "She has gray eyes and silver earrings."
    target_language: "es"
    correct_translation: "Tiene los ojos grises y los pendientes plateados."
    alternatives:
      - "Tiene ojos grises y pendientes plateados."
      - "Ella tiene los ojos grises y los aretes plateados."
