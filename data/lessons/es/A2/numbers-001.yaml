id: numbers-001
title: Numbers in Daily Life
description: Use numbers for prices, phone numbers, and dates
language: es
level: A2
estimated_minutes: 7
category: numbers
tags:
  - numbers
  - prices
  - dates
  - practical
vocabulary_count: 10
icon: "🔢"

steps:
  - type: instruction
    content: "Numbers are essential for everyday situations. Learn how to discuss prices, give your phone number, and talk about dates in Spanish."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: "¿Cuánto cuesta?"
        translation: "How much does it cost?"
      - word: "¿Cuánto es?"
        translation: "How much is it?"
      - word: "ciento"
        translation: "one hundred (before another number)"
      - word: "doscientos/as"
        translation: "two hundred"
      - word: "mil"
        translation: "one thousand"
      - word: "el precio"
        translation: "the price"
      - word: "el número de teléfono"
        translation: "the phone number"
      - word: "la fecha"
        translation: "the date"
      - word: "primero"
        translation: "first (ordinal)"
      - word: "segundo"
        translation: "second (ordinal)"
    order: 2

  - type: example
    content: "¿Cuánto cuesta esta camisa? - Cuesta veinticinco euros con cincuenta céntimos."
    translation: "How much does this shirt cost? - It costs twenty-five euros and fifty cents."
    order: 3

  - type: example
    content: "Mi número de teléfono es el seis, cinco, cuatro, tres, dos, uno, cero, nueve, ocho."
    translation: "My phone number is 6-5-4-3-2-1-0-9-8."
    order: 4

  - type: tip
    content: "'Cien' is used alone (100), but 'ciento' before other numbers: ciento uno (101), ciento veinte (120). Hundreds agree in gender: doscientas personas (200 people, feminine)."
    order: 5

  - type: tip
    content: "In Spanish, phone numbers are often given digit by digit. Dates use cardinal numbers except for the first: 'el primero de mayo' but 'el dos de mayo'."
    order: 6

  - type: practice
    content: "Practice numbers in real situations!"
    exercise_id: "ex-mc-num-a2-001"
    order: 7

exercises:
  - id: ex-mc-num-a2-001
    type: multiple_choice
    question: "How do you ask 'How much does it cost?'"
    options:
      - "¿Qué cuesta?"
      - "¿Cuánto cuesta?"
      - "¿Dónde cuesta?"
      - "¿Cuándo cuesta?"
    correct_index: 1
    explanation: "'¿Cuánto cuesta?' uses 'cuánto' (how much) to ask about price."

  - id: ex-fb-num-a2-001
    type: fill_blank
    sentence_template: "Son _____ cincuenta euros. (150)"
    correct_answer: "ciento"
    alternatives:
      - "Ciento"
    hint: "One hundred before another number"

  - id: ex-tr-num-a2-001
    type: translate
    source_text: "It costs two hundred and fifty dollars."
    target_language: "es"
    correct_translation: "Cuesta doscientos cincuenta dólares."
    alternatives:
      - "Son doscientos cincuenta dólares."
      - "Cuesta 250 dólares."

  - id: ex-tr-num-a2-002
    type: translate
    source_text: "The date is March first."
    target_language: "es"
    correct_translation: "La fecha es el primero de marzo."
    alternatives:
      - "Es el primero de marzo."
      - "Hoy es el primero de marzo."
