id: family-001
title: Extended Family
description: Learn vocabulary for extended family and family events
language: es
level: A2
estimated_minutes: 6
category: family
tags:
  - family
  - extended-family
  - relationships
  - events
vocabulary_count: 10
icon: "👨‍👩‍👧‍👦"

steps:
  - type: instruction
    content: "Family gatherings are important in Spanish-speaking cultures. Let's expand your vocabulary to include extended family members and talk about family events."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: "el abuelo / la abuela"
        translation: "the grandfather / grandmother"
      - word: "los abuelos"
        translation: "the grandparents"
      - word: "el nieto / la nieta"
        translation: "the grandson / granddaughter"
      - word: "el tío / la tía"
        translation: "the uncle / aunt"
      - word: "el primo / la prima"
        translation: "the cousin (m/f)"
      - word: "el sobrino / la sobrina"
        translation: "the nephew / niece"
      - word: "el cuñado / la cuñada"
        translation: "the brother-in-law / sister-in-law"
      - word: "el suegro / la suegra"
        translation: "the father-in-law / mother-in-law"
      - word: "la reunión familiar"
        translation: "the family gathering"
      - word: "la boda"
        translation: "the wedding"
    order: 2

  - type: example
    content: "Mis abuelos viven en México. Los visito cada verano."
    translation: "My grandparents live in Mexico. I visit them every summer."
    order: 3

  - type: example
    content: "La boda de mi prima fue el sábado pasado."
    translation: "My cousin's wedding was last Saturday."
    order: 4

  - type: tip
    content: "Notice the preterite tense 'fue' (was). Use it for completed events in the past: 'La reunión fue ayer' (The gathering was yesterday)."
    order: 5

  - type: tip
    content: "In-laws add '-político/a' formally: 'padre político' = father-in-law, but 'suegro/suegra' is much more common in everyday speech."
    order: 6

  - type: practice
    content: "Practice extended family vocabulary!"
    exercise_id: "ex-mc-fam-a2-001"
    order: 7

exercises:
  - id: ex-mc-fam-a2-001
    type: multiple_choice
    question: "What does 'mi sobrina' mean?"
    options:
      - "my cousin"
      - "my niece"
      - "my granddaughter"
      - "my sister-in-law"
    correct_index: 1
    explanation: "'Sobrina' means niece. 'Sobrino' is nephew."

  - id: ex-fb-fam-a2-001
    type: fill_blank
    sentence_template: "Mi _____ es el padre de mi esposo."
    correct_answer: "suegro"
    alternatives:
      - "Suegro"
    hint: "Father-in-law"

  - id: ex-tr-fam-a2-001
    type: translate
    source_text: "My grandparents came to the wedding."
    target_language: "es"
    correct_translation: "Mis abuelos vinieron a la boda."
    alternatives:
      - "Mis abuelos fueron a la boda."
      - "Mis abuelos asistieron a la boda."

  - id: ex-tr-fam-a2-002
    type: translate
    source_text: "I have three cousins and two nephews."
    target_language: "es"
    correct_translation: "Tengo tres primos y dos sobrinos."
    alternatives:
      - "Tengo tres primas y dos sobrinas."
      - "Tengo 3 primos y 2 sobrinos."
