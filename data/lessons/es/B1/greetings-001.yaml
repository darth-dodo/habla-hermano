id: greetings-001
title: Professional and Cultural Greetings
description: Master greetings for professional settings and understand cultural nuances
language: es
level: B1
estimated_minutes: 8
category: greetings
tags:
  - greeting
  - professional
  - cultural
  - business
vocabulary_count: 12
icon: "👋"

steps:
  - type: instruction
    content: "At the B1 level, you'll need to navigate professional situations and understand cultural subtleties in greetings. This lesson covers business Spanish and regional variations."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: "Estimado/a señor/a"
        translation: "Dear Sir/Madam (formal written)"
      - word: "Muy señor mío"
        translation: "Dear Sir (very formal)"
      - word: "Le saluda atentamente"
        translation: "Yours faithfully"
      - word: "Un cordial saludo"
        translation: "Kind regards"
      - word: "Espero que se encuentre bien"
        translation: "I hope this finds you well"
      - word: "Permítame presentarme"
        translation: "Allow me to introduce myself"
      - word: "Es un honor conocerle"
        translation: "It's an honor to meet you"
      - word: "Agradezco su tiempo"
        translation: "I appreciate your time"
      - word: "Quedamos a su disposición"
        translation: "We remain at your service"
      - word: "Sin otro particular"
        translation: "With nothing further to add"
      - word: "Reciba un afectuoso saludo"
        translation: "Receive a warm greeting"
      - word: "Atentamente"
        translation: "Sincerely"
    order: 2

  - type: example
    content: "Estimada señora González: Espero que se encuentre bien. Le escribo para informarle sobre..."
    translation: "Dear Mrs. González: I hope this finds you well. I am writing to inform you about..."
    order: 3

  - type: example
    content: "Es un honor conocerle, señor Director. Permítame presentarme: soy el nuevo gerente de ventas."
    translation: "It's an honor to meet you, Mr. Director. Allow me to introduce myself: I'm the new sales manager."
    order: 4

  - type: tip
    content: "In Spain, professional emails often use subjunctive: 'Espero que esté bien' (I hope you are well). The subjunctive shows uncertainty or wishes."
    order: 5

  - type: tip
    content: "Physical greetings vary: In Spain and Latin America, a light kiss on each cheek is common between women or between a man and woman. In business, a handshake is standard."
    order: 6

  - type: practice
    content: "Practice professional greetings!"
    exercise_id: "ex-mc-greet-b1-001"
    order: 7

exercises:
  - id: ex-mc-greet-b1-001
    type: multiple_choice
    question: "Which phrase is appropriate to begin a formal business email?"
    options:
      - "¡Hola! ¿Qué tal?"
      - "Estimado señor García:"
      - "¿Qué onda, jefe?"
      - "Buenas, compañero"
    correct_index: 1
    explanation: "'Estimado señor García:' is the formal salutation for business correspondence."

  - id: ex-fb-greet-b1-001
    type: fill_blank
    sentence_template: "Espero que se _____ bien."
    correct_answer: "encuentre"
    alternatives:
      - "Encuentre"
    hint: "Subjunctive form of 'encontrar' (reflexive)"

  - id: ex-tr-greet-b1-001
    type: translate
    source_text: "Allow me to introduce myself. I'm the new marketing director."
    target_language: "es"
    correct_translation: "Permítame presentarme. Soy el nuevo director de marketing."
    alternatives:
      - "Permítame presentarme. Soy la nueva directora de marketing."
      - "Déjeme presentarme. Soy el nuevo director de mercadeo."

  - id: ex-tr-greet-b1-002
    type: translate
    source_text: "I appreciate your time. Kind regards."
    target_language: "es"
    correct_translation: "Agradezco su tiempo. Un cordial saludo."
    alternatives:
      - "Le agradezco su tiempo. Un cordial saludo."
      - "Agradezco su tiempo. Saludos cordiales."

  - id: ex-tr-greet-b1-003
    type: translate
    source_text: "It's an honor to meet you. I hope we can work together."
    target_language: "es"
    correct_translation: "Es un honor conocerle. Espero que podamos trabajar juntos."
    alternatives:
      - "Es un honor conocerlo. Espero que podamos colaborar."
      - "Es un honor conocerla. Espero que trabajemos juntos."
