id: numbers-001
title: Numbers in Business and Statistics
description: Use numbers for business, percentages, and statistical expressions
language: es
level: B1
estimated_minutes: 8
category: numbers
tags:
  - numbers
  - business
  - percentages
  - statistics
vocabulary_count: 12
icon: "🔢"

steps:
  - type: instruction
    content: "In professional contexts, you'll need to discuss statistics, percentages, and business figures. Learn the vocabulary and structures for numerical communication in business Spanish."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: "el porcentaje"
        translation: "the percentage"
      - word: "por ciento"
        translation: "percent"
      - word: "la mitad"
        translation: "half"
      - word: "un tercio"
        translation: "one third"
      - word: "un cuarto"
        translation: "one quarter"
      - word: "el doble"
        translation: "double"
      - word: "el triple"
        translation: "triple"
      - word: "aumentar/incrementar"
        translation: "to increase"
      - word: "disminuir/reducir"
        translation: "to decrease/reduce"
      - word: "aproximadamente"
        translation: "approximately"
      - word: "alcanzar"
        translation: "to reach"
      - word: "superar"
        translation: "to exceed/surpass"
    order: 2

  - type: example
    content: "Las ventas aumentaron un veinticinco por ciento respecto al año anterior."
    translation: "Sales increased by twenty-five percent compared to the previous year."
    order: 3

  - type: example
    content: "Esperamos que los beneficios superen el millón de euros este trimestre."
    translation: "We expect profits to exceed one million euros this quarter."
    order: 4

  - type: tip
    content: "Note: 'Esperamos que... superen' uses the subjunctive after 'esperar que' (to hope that). The subjunctive is required after expressions of expectation, doubt, or desire."
    order: 5

  - type: tip
    content: "In Spain, decimals use commas and thousands use periods: 1.500,50 € (one thousand five hundred euros and fifty cents). Latin America often follows US conventions."
    order: 6

  - type: practice
    content: "Practice business numbers and statistics!"
    exercise_id: "ex-mc-num-b1-001"
    order: 7

exercises:
  - id: ex-mc-num-b1-001
    type: multiple_choice
    question: "How do you say 'Sales doubled this year'?"
    options:
      - "Las ventas aumentaron este año"
      - "Las ventas se duplicaron este año"
      - "Las ventas disminuyeron este año"
      - "Las ventas se triplicaron este año"
    correct_index: 1
    explanation: "'Se duplicaron' (doubled/were duplicated) is the reflexive form meaning 'became double.'"

  - id: ex-fb-num-b1-001
    type: fill_blank
    sentence_template: "Los precios aumentaron un treinta por _____."
    correct_answer: "ciento"
    alternatives:
      - "Ciento"
    hint: "The word that follows numbers to mean 'percent'"

  - id: ex-tr-num-b1-001
    type: translate
    source_text: "Approximately half of the employees work remotely."
    target_language: "es"
    correct_translation: "Aproximadamente la mitad de los empleados trabaja de forma remota."
    alternatives:
      - "Aproximadamente la mitad de los empleados trabajan de forma remota."
      - "Cerca de la mitad de los empleados trabaja remotamente."

  - id: ex-tr-num-b1-002
    type: translate
    source_text: "We expect the costs to decrease by fifteen percent."
    target_language: "es"
    correct_translation: "Esperamos que los costes disminuyan un quince por ciento."
    alternatives:
      - "Esperamos que los costos se reduzcan un quince por ciento."
      - "Esperamos que los gastos bajen un 15%."

  - id: ex-tr-num-b1-003
    type: translate
    source_text: "The company reached one million customers last quarter."
    target_language: "es"
    correct_translation: "La empresa alcanzó un millón de clientes el trimestre pasado."
    alternatives:
      - "La compañía llegó a un millón de clientes el trimestre pasado."
      - "La empresa llegó al millón de clientes el último trimestre."
