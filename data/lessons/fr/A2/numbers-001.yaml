id: numbers-001
title: Numbers, Dates, and Time
description: Learn to express dates, times, and large numbers in French
language: fr
level: A2
estimated_minutes: 5
category: numbers
tags:
  - numbers
  - dates
  - time
  - ordinal
vocabulary_count: 10
icon: "🔢"

steps:
  - type: instruction
    content: "Let's master dates and times! French has unique ways to express when things happen."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: premier / première
        translation: first (masc. / fem.)
      - word: deuxième
        translation: second
      - word: dernier / dernière
        translation: last (masc. / fem.)
      - word: mille
        translation: one thousand
      - word: un million
        translation: one million
      - word: une fois
        translation: one time / once
      - word: deux fois par semaine
        translation: twice a week
      - word: Quelle heure est-il?
        translation: what time is it?
      - word: Il est midi
        translation: it's noon
      - word: Il est minuit
        translation: it's midnight
    order: 2

  - type: example
    content: "C'est le premier janvier deux mille vingt-cinq."
    translation: "It's January first, 2025."
    order: 3

  - type: example
    content: "J'y vais deux fois par semaine, le lundi et le jeudi."
    translation: "I go there twice a week, on Mondays and Thursdays."
    order: 4

  - type: tip
    content: "Only 'premier' (first) has a special ordinal form. Others add '-ième': deux→deuxième, trois→troisième."
    order: 5

  - type: tip
    content: "For dates, French uses 'le' + cardinal number: 'le deux mars' (March 2nd), except 'le premier' (the 1st)."
    order: 6

  - type: practice
    content: "Test your knowledge of French numbers, dates, and times!"
    exercise_id: "ex-mc-num-001"
    order: 7

exercises:
  - id: ex-mc-num-001
    type: multiple_choice
    question: "How do you say 'the third time'?"
    options:
      - la trois fois
      - la troisième fois
      - le troisième fois
      - la première fois
    correct_index: 1
    explanation: "Troisième (third) + fois (time). Use 'la' because 'fois' is feminine."

  - id: ex-fb-num-001
    type: fill_blank
    sentence_template: "C'est le _____ mai."
    correct_answer: "premier"
    alternatives: []
    hint: "It's May 1st (use ordinal for the first)"

  - id: ex-tr-num-001
    type: translate
    source_text: "What time is it?"
    target_language: "fr"
    correct_translation: "Quelle heure est-il?"
    alternatives:
      - "Quelle heure est-il"
      - "Il est quelle heure?"

  - id: ex-tr-num-002
    type: translate
    source_text: "I exercise three times a week."
    target_language: "fr"
    correct_translation: "Je fais du sport trois fois par semaine."
    alternatives:
      - "Je fais de l'exercice trois fois par semaine."
