id: introductions-001
title: Describing Yourself in Detail
description: Learn to describe your background, interests, and daily life in French
language: fr
level: A2
estimated_minutes: 5
category: introductions
tags:
  - introduction
  - description
  - interests
  - daily life
vocabulary_count: 10
icon: "🙋"

steps:
  - type: instruction
    content: "Let's learn to describe yourself in more detail! You'll talk about your interests, habits, and background."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: Je m'intéresse à
        translation: I'm interested in
      - word: Je suis passionné(e) de
        translation: I'm passionate about
      - word: Pendant mon temps libre
        translation: during my free time
      - word: J'ai grandi à
        translation: I grew up in
      - word: J'ai déménagé
        translation: I moved (house)
      - word: Je me suis installé(e)
        translation: I settled (somewhere)
      - word: Je travaille comme
        translation: I work as
      - word: Je fais des études de
        translation: I'm studying (field)
      - word: Mon rêve est de
        translation: my dream is to
      - word: Ce qui me plaît, c'est
        translation: what I like is
    order: 2

  - type: example
    content: "J'ai grandi à Lyon mais j'ai déménagé à Paris il y a deux ans."
    translation: "I grew up in Lyon but I moved to Paris two years ago."
    order: 3

  - type: example
    content: "Je suis passionnée de musique. Pendant mon temps libre, je joue de la guitare."
    translation: "I'm passionate about music. During my free time, I play guitar."
    order: 4

  - type: tip
    content: "Notice the passé composé: 'J'ai grandi' (I grew up), 'J'ai déménagé' (I moved). These describe completed past actions."
    order: 5

  - type: tip
    content: "Reflexive verbs use être in passé composé: 'Je me suis installé(e)' - add 'e' for feminine agreement."
    order: 6

  - type: practice
    content: "Test your ability to describe yourself in detail!"
    exercise_id: "ex-mc-intro-001"
    order: 7

exercises:
  - id: ex-mc-intro-001
    type: multiple_choice
    question: "How do you say 'I'm interested in art'?"
    options:
      - Je suis passionné d'art
      - Je m'intéresse à l'art
      - Je travaille comme artiste
      - J'ai grandi dans l'art
    correct_index: 1
    explanation: "Je m'intéresse à means 'I'm interested in'. Note the reflexive verb form."

  - id: ex-fb-intro-001
    type: fill_blank
    sentence_template: "J'ai _____ à Marseille quand j'étais enfant."
    correct_answer: "grandi"
    alternatives: []
    hint: "I grew up in Marseille when I was a child"

  - id: ex-tr-intro-001
    type: translate
    source_text: "I moved to France three years ago."
    target_language: "fr"
    correct_translation: "J'ai déménagé en France il y a trois ans."
    alternatives:
      - "J'ai déménagé en France il y a 3 ans."

  - id: ex-tr-intro-002
    type: translate
    source_text: "During my free time, I read books."
    target_language: "fr"
    correct_translation: "Pendant mon temps libre, je lis des livres."
    alternatives:
      - "Pendant mon temps libre je lis des livres."
