id: family-001
title: Family Life and Relationships
description: Learn to describe family dynamics, relationships, and life events in French
language: fr
level: A2
estimated_minutes: 5
category: family
tags:
  - family
  - relationships
  - life events
  - descriptions
vocabulary_count: 10
icon: "👨‍👩‍👧‍👦"

steps:
  - type: instruction
    content: "Let's talk about family life! You'll learn to describe relationships and important life events."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: le beau-père
        translation: stepfather / father-in-law
      - word: la belle-mère
        translation: stepmother / mother-in-law
      - word: le demi-frère
        translation: half-brother / stepbrother
      - word: la demi-sœur
        translation: half-sister / stepsister
      - word: se marier avec
        translation: to marry (someone)
      - word: divorcer
        translation: to divorce
      - word: se fiancer
        translation: to get engaged
      - word: l'enfance
        translation: childhood
      - word: être proche de
        translation: to be close to
      - word: s'entendre bien avec
        translation: to get along well with
    order: 2

  - type: example
    content: "Ma mère s'est remariée quand j'avais dix ans. Mon beau-père est très gentil."
    translation: "My mother remarried when I was ten. My stepfather is very kind."
    order: 3

  - type: example
    content: "Je m'entends bien avec ma demi-sœur. On est très proches."
    translation: "I get along well with my stepsister. We are very close."
    order: 4

  - type: tip
    content: "Reflexive verbs show the action affects oneself: 'se marier' (to get married), 'se fiancer' (to get engaged)."
    order: 5

  - type: tip
    content: "Use imparfait for background info ('quand j'avais dix ans') and passé composé for events ('elle s'est remariée')."
    order: 6

  - type: practice
    content: "Test your knowledge of French family vocabulary!"
    exercise_id: "ex-mc-fam-001"
    order: 7

exercises:
  - id: ex-mc-fam-001
    type: multiple_choice
    question: "What does 'le beau-père' mean?"
    options:
      - beautiful father
      - grandfather
      - stepfather or father-in-law
      - uncle
    correct_index: 2
    explanation: "Le beau-père means stepfather or father-in-law, depending on context."

  - id: ex-fb-fam-001
    type: fill_blank
    sentence_template: "Elle s'est _____ avec son ami d'enfance."
    correct_answer: "mariée"
    alternatives:
      - "fiancée"
    hint: "She married (past tense, feminine) her childhood friend"

  - id: ex-tr-fam-001
    type: translate
    source_text: "I get along well with my brother."
    target_language: "fr"
    correct_translation: "Je m'entends bien avec mon frère."
    alternatives:
      - "Je m'entends bien avec mon frère"

  - id: ex-tr-fam-002
    type: translate
    source_text: "My parents divorced when I was young."
    target_language: "fr"
    correct_translation: "Mes parents ont divorcé quand j'étais jeune."
    alternatives:
      - "Mes parents ont divorcé quand j'étais petit."
      - "Mes parents ont divorcé quand j'étais petite."
