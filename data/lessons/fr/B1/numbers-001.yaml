id: numbers-001
title: Statistics, Percentages, and Data
description: Learn to discuss statistics, percentages, and quantitative information in French
language: fr
level: B1
estimated_minutes: 6
category: numbers
tags:
  - numbers
  - statistics
  - percentages
  - data
vocabulary_count: 12
icon: "🔢"

steps:
  - type: instruction
    content: "Let's discuss numbers in context! You'll learn to present statistics, percentages, and quantitative data professionally."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: le pourcentage
        translation: the percentage
      - word: environ / à peu près
        translation: approximately
      - word: la moitié
        translation: half
      - word: le tiers
        translation: one third
      - word: le quart
        translation: one quarter
      - word: augmenter de
        translation: to increase by
      - word: diminuer de
        translation: to decrease by
      - word: le taux de
        translation: the rate of
      - word: en moyenne
        translation: on average
      - word: par rapport à
        translation: compared to
      - word: soit
        translation: that is / namely
      - word: il est probable que
        translation: it is likely that (+ subjunctive)
    order: 2

  - type: example
    content: "Le taux de chômage a diminué de 2%, soit environ 50 000 emplois créés."
    translation: "The unemployment rate has decreased by 2%, that is approximately 50,000 jobs created."
    order: 3

  - type: example
    content: "Il est probable que les ventes augmentent de 15% par rapport à l'année dernière."
    translation: "It is likely that sales will increase by 15% compared to last year."
    order: 4

  - type: tip
    content: "After 'il est probable que', use the subjunctive: 'augmentent' (subjunctive) not 'augmenteront' (future)."
    order: 5

  - type: tip
    content: "Use 'soit' to clarify or explain a number: 'deux millions, soit 10% de la population' (two million, that is 10% of the population)."
    order: 6

  - type: practice
    content: "Test your ability to discuss statistics in French!"
    exercise_id: "ex-mc-num-001"
    order: 7

exercises:
  - id: ex-mc-num-001
    type: multiple_choice
    question: "How do you say 'on average' in French?"
    options:
      - par rapport
      - environ
      - en moyenne
      - le taux
    correct_index: 2
    explanation: "En moyenne means 'on average' in French."

  - id: ex-fb-num-001
    type: fill_blank
    sentence_template: "Les prix ont _____ de 5% cette année."
    correct_answer: "augmenté"
    alternatives:
      - "diminué"
    hint: "Prices have increased by 5% this year"

  - id: ex-tr-num-001
    type: translate
    source_text: "Approximately half of the students passed."
    target_language: "fr"
    correct_translation: "Environ la moitié des étudiants ont réussi."
    alternatives:
      - "À peu près la moitié des étudiants ont réussi."

  - id: ex-tr-num-002
    type: translate
    source_text: "The rate decreased by one third."
    target_language: "fr"
    correct_translation: "Le taux a diminué d'un tiers."
    alternatives:
      - "Le taux a baissé d'un tiers."

  - id: ex-tr-num-003
    type: translate
    source_text: "Compared to last year, sales increased by 20%."
    target_language: "fr"
    correct_translation: "Par rapport à l'année dernière, les ventes ont augmenté de 20%."
    alternatives:
      - "Par rapport à l'an dernier, les ventes ont augmenté de 20%."
