id: greetings-001
title: Formal and Professional Greetings
description: Master formal greetings, professional correspondence, and nuanced social interactions
language: fr
level: B1
estimated_minutes: 6
category: greetings
tags:
  - greeting
  - professional
  - formal
  - correspondence
vocabulary_count: 12
icon: "👋"

steps:
  - type: instruction
    content: "Let's master professional and formal French! You'll learn greetings for business, formal letters, and sophisticated social situations."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: Veuillez agréer mes salutations distinguées
        translation: please accept my distinguished greetings (formal letter closing)
      - word: Je vous prie de bien vouloir
        translation: I kindly ask you to (formal request)
      - word: C'est un plaisir de faire votre connaissance
        translation: it's a pleasure to make your acquaintance
      - word: Je me permets de vous contacter
        translation: I take the liberty of contacting you
      - word: Suite à notre conversation
        translation: following our conversation
      - word: Dans l'attente de votre réponse
        translation: awaiting your response
      - word: Je souhaiterais
        translation: I would like (conditional, polite)
      - word: Auriez-vous la gentillesse de
        translation: would you be so kind as to
      - word: Je vous saurais gré de
        translation: I would be grateful if you
      - word: Permettez-moi de me présenter
        translation: allow me to introduce myself
      - word: Je vous remercie par avance
        translation: I thank you in advance
      - word: Cordialement
        translation: cordially / best regards
    order: 2

  - type: example
    content: "Je me permets de vous contacter suite à notre conversation. Je souhaiterais obtenir plus d'informations."
    translation: "I take the liberty of contacting you following our conversation. I would like to obtain more information."
    order: 3

  - type: example
    content: "Auriez-vous la gentillesse de m'envoyer les documents? Je vous remercie par avance."
    translation: "Would you be so kind as to send me the documents? I thank you in advance."
    order: 4

  - type: tip
    content: "The conditional tense (je souhaiterais, auriez-vous) makes requests much more polite than the present tense."
    order: 5

  - type: tip
    content: "In formal French, avoid 'je veux' (I want). Use 'je souhaiterais' or 'j'aimerais' (I would like) instead."
    order: 6

  - type: practice
    content: "Test your knowledge of formal French greetings!"
    exercise_id: "ex-mc-greet-001"
    order: 7

exercises:
  - id: ex-mc-greet-001
    type: multiple_choice
    question: "Which phrase would you use to politely request something in a formal email?"
    options:
      - Je veux que vous fassiez
      - Auriez-vous la gentillesse de
      - Fais-le maintenant
      - Tu peux faire ça?
    correct_index: 1
    explanation: "Auriez-vous la gentillesse de (would you be so kind as to) is the most polite formal request."

  - id: ex-fb-greet-001
    type: fill_blank
    sentence_template: "Je me _____ de vous contacter concernant votre offre d'emploi."
    correct_answer: "permets"
    alternatives: []
    hint: "I take the liberty of contacting you"

  - id: ex-tr-greet-001
    type: translate
    source_text: "I would like to schedule a meeting."
    target_language: "fr"
    correct_translation: "Je souhaiterais organiser une réunion."
    alternatives:
      - "J'aimerais organiser une réunion."
      - "Je voudrais organiser une réunion."

  - id: ex-tr-greet-002
    type: translate
    source_text: "I thank you in advance for your response."
    target_language: "fr"
    correct_translation: "Je vous remercie par avance de votre réponse."
    alternatives:
      - "Je vous remercie par avance pour votre réponse."

  - id: ex-tr-greet-003
    type: translate
    source_text: "Allow me to introduce myself."
    target_language: "fr"
    correct_translation: "Permettez-moi de me présenter."
    alternatives:
      - "Permets-moi de me présenter."
