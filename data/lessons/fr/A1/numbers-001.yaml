id: numbers-001
title: Numbers 11-100
description: Learn numbers from eleven to one hundred in French
language: fr
level: A1
estimated_minutes: 4
category: numbers
tags:
  - numbers
  - counting
  - intermediate
vocabulary_count: 8
icon: "🔢"

steps:
  - type: instruction
    content: "Let's learn bigger numbers in French! French numbers have some unique patterns to discover."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: onze
        translation: eleven
      - word: douze
        translation: twelve
      - word: vingt
        translation: twenty
      - word: trente
        translation: thirty
      - word: cinquante
        translation: fifty
      - word: soixante
        translation: sixty
      - word: quatre-vingts
        translation: eighty (4 × 20)
      - word: cent
        translation: one hundred
    order: 2

  - type: example
    content: "J'ai vingt-cinq ans."
    translation: "I am twenty-five years old."
    order: 3

  - type: example
    content: "Le livre coûte trente euros."
    translation: "The book costs thirty euros."
    order: 4

  - type: tip
    content: "French uses a base-20 system for some numbers: quatre-vingts (80) literally means 'four twenties'!"
    order: 5

  - type: tip
    content: "For 21, 31, 41, 51, 61 use 'et un': vingt et un (21), trente et un (31). But 22-29 use hyphen: vingt-deux."
    order: 6

  - type: practice
    content: "Test your knowledge of French numbers!"
    exercise_id: "ex-mc-num-001"
    order: 7

exercises:
  - id: ex-mc-num-001
    type: multiple_choice
    question: "What is 'quatre-vingts' in English?"
    options:
      - forty
      - sixty
      - eighty
      - one hundred
    correct_index: 2
    explanation: "Quatre-vingts literally means 'four twenties' which equals eighty."

  - id: ex-mc-num-002
    type: multiple_choice
    question: "How do you say 'fifty' in French?"
    options:
      - quarante
      - cinquante
      - soixante
      - trente
    correct_index: 1
    explanation: "Cinquante means 'fifty' in French."

  - id: ex-fb-num-001
    type: fill_blank
    sentence_template: "J'ai _____ ans."
    correct_answer: "vingt"
    alternatives:
      - trente
      - quarante
    hint: "I am twenty years old"

  - id: ex-fb-num-002
    type: fill_blank
    sentence_template: "Il y a _____ étudiants dans la classe."
    correct_answer: "trente"
    alternatives:
      - vingt
      - quarante
      - cinquante
    hint: "There are thirty students"
