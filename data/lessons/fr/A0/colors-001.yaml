id: colors-001
title: Basic Colors
description: Learn the main colors in French
language: fr
level: A0
estimated_minutes: 3
category: colors
tags:
  - colors
  - basics
  - adjectives
vocabulary_count: 6
icon: "🎨"

steps:
  - type: instruction
    content: "Let's learn colors in French! Colors are useful for describing things around you."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: rouge
        translation: red
      - word: bleu / bleue
        translation: blue (masc. / fem.)
      - word: vert / verte
        translation: green (masc. / fem.)
      - word: jaune
        translation: yellow
      - word: noir / noire
        translation: black (masc. / fem.)
      - word: blanc / blanche
        translation: white (masc. / fem.)
    order: 2

  - type: example
    content: "Le ciel est bleu."
    translation: "The sky is blue."
    order: 3

  - type: example
    content: "La pomme est rouge."
    translation: "The apple is red."
    order: 4

  - type: tip
    content: "Many colors change form for feminine nouns: bleu→bleue, vert→verte, blanc→blanche."
    order: 5

  - type: tip
    content: "Rouge and jaune stay the same for both masculine and feminine nouns!"
    order: 6

  - type: practice
    content: "Test your knowledge of French colors!"
    exercise_id: "ex-mc-col-001"
    order: 7

exercises:
  - id: ex-mc-col-001
    type: multiple_choice
    question: "What color is 'rouge'?"
    options:
      - blue
      - green
      - red
      - yellow
    correct_index: 2
    explanation: "Rouge means 'red' in French."

  - id: ex-mc-col-002
    type: multiple_choice
    question: "How do you say 'white' (feminine) in French?"
    options:
      - blanc
      - blanche
      - noir
      - noire
    correct_index: 1
    explanation: "Blanche is the feminine form of 'white'. Blanc is masculine."

  - id: ex-mc-col-003
    type: multiple_choice
    question: "Which color stays the same for masculine and feminine?"
    options:
      - bleu
      - vert
      - jaune
      - noir
    correct_index: 2
    explanation: "Jaune (yellow) doesn't change form - it's the same for masculine and feminine nouns."
