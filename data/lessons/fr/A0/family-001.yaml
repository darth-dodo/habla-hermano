id: family-001
title: Immediate Family
description: Learn words for immediate family members in French
language: fr
level: A0
estimated_minutes: 3
category: family
tags:
  - family
  - basics
  - relationships
vocabulary_count: 6
icon: "👨‍👩‍👧‍👦"

steps:
  - type: instruction
    content: "Let's learn family words in French! La famille is an important topic in French culture."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: la mère
        translation: mother
      - word: le père
        translation: father
      - word: la sœur
        translation: sister
      - word: le frère
        translation: brother
      - word: la famille
        translation: family
      - word: les parents
        translation: parents
    order: 2

  - type: example
    content: "Ma mère s'appelle Sophie."
    translation: "My mother's name is Sophie."
    order: 3

  - type: example
    content: "J'ai un frère et une sœur."
    translation: "I have one brother and one sister."
    order: 4

  - type: tip
    content: "Notice the articles: 'la' for feminine (mère, sœur) and 'le' for masculine (père, frère)."
    order: 5

  - type: tip
    content: "In sœur, the 'œ' makes an 'uh' sound. The final 'r' is soft and guttural."
    order: 6

  - type: practice
    content: "Test your knowledge of French family words!"
    exercise_id: "ex-mc-fam-001"
    order: 7

exercises:
  - id: ex-mc-fam-001
    type: multiple_choice
    question: "What does 'le père' mean?"
    options:
      - mother
      - father
      - brother
      - sister
    correct_index: 1
    explanation: "Le père means 'father' in French."

  - id: ex-mc-fam-002
    type: multiple_choice
    question: "How do you say 'sister' in French?"
    options:
      - le frère
      - la mère
      - la sœur
      - le père
    correct_index: 2
    explanation: "La sœur means 'sister' in French."

  - id: ex-mc-fam-003
    type: multiple_choice
    question: "What does 'les parents' mean?"
    options:
      - family
      - parents
      - children
      - siblings
    correct_index: 1
    explanation: "Les parents means 'parents' (mother and father) in French."
