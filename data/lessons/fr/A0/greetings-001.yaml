id: greetings-001
title: Basic Greetings
description: Learn to say hello and goodbye in French
language: fr
level: A0
estimated_minutes: 3
category: greetings
tags:
  - greeting
  - basics
  - hello
  - goodbye
vocabulary_count: 6
icon: "👋"

steps:
  - type: instruction
    content: "Bienvenue! Welcome to your first French lesson! Let's learn essential greetings."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: Bonjour
        translation: hello / good day
      - word: Au revoir
        translation: goodbye
      - word: Bonsoir
        translation: good evening
      - word: Bonne nuit
        translation: good night
      - word: Salut
        translation: hi / bye (informal)
      - word: À bientôt
        translation: see you soon
    order: 2

  - type: example
    content: "Bonjour, comment allez-vous?"
    translation: "Hello, how are you? (formal)"
    order: 3

  - type: example
    content: "Salut, ça va?"
    translation: "Hi, how's it going? (informal)"
    order: 4

  - type: tip
    content: "Bonjour is used from morning until evening. After sunset, switch to Bonsoir (good evening)."
    order: 5

  - type: tip
    content: "The 'r' in Bonjour and Au revoir comes from the throat - it's a soft, guttural sound. Don't roll it!"
    order: 6

  - type: practice
    content: "Test your knowledge of French greetings!"
    exercise_id: "ex-mc-greet-001"
    order: 7

exercises:
  - id: ex-mc-greet-001
    type: multiple_choice
    question: "How do you say 'hello' in French?"
    options:
      - Bonjour
      - Au revoir
      - Merci
      - S'il vous plaît
    correct_index: 0
    explanation: "Bonjour means 'hello' or 'good day' in French."

  - id: ex-mc-greet-002
    type: multiple_choice
    question: "What greeting would you use at 8 PM?"
    options:
      - Bonjour
      - Bonne nuit
      - Bonsoir
      - Salut
    correct_index: 2
    explanation: "Bonsoir (good evening) is used after sunset."

  - id: ex-mc-greet-003
    type: multiple_choice
    question: "How do you say 'goodbye' formally?"
    options:
      - Salut
      - Bonjour
      - Au revoir
      - Bonsoir
    correct_index: 2
    explanation: "Au revoir is the standard way to say goodbye."
