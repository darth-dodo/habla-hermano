id: family-001
title: Family Dynamics and Relationships
description: Discuss complex family relationships, emotions, and life changes
language: de
level: B1
estimated_minutes: 10
category: family
tags:
  - family
  - relationships
  - emotions
  - life changes
vocabulary_count: 12
icon: "👨‍👩‍👧‍👦"

steps:
  - type: instruction
    content: "Let's discuss complex family dynamics! You'll learn to talk about relationships, emotions, and life changes using Konjunktiv II for hypotheticals and Dative constructions for expressing feelings."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: die Beziehung
        translation: the relationship (feminine)
      - word: sich verstehen mit
        translation: to get along with (+ Dative)
      - word: sich streiten mit
        translation: to argue with (+ Dative)
      - word: Mir liegt viel an ihr
        translation: She means a lot to me (Dative)
      - word: Es tut mir weh
        translation: It hurts me (Dative)
      - word: die Trennung
        translation: the separation (feminine)
      - word: zusammenziehen
        translation: to move in together
      - word: die Patchwork-Familie
        translation: the blended family (feminine)
      - word: Wenn ich an ihrer Stelle wäre
        translation: If I were in her place
      - word: der Generationskonflikt
        translation: the generational conflict (masculine)
      - word: sich versöhnen mit
        translation: to reconcile with (+ Dative)
      - word: unterstützen
        translation: to support
    order: 2

  - type: example
    content: "Ich verstehe mich gut mit meinen Schwiegereltern."
    translation: "I get along well with my in-laws."
    order: 3

  - type: example
    content: "Wenn ich an deiner Stelle wäre, würde ich mit ihm sprechen."
    translation: "If I were in your place, I would talk to him."
    order: 4

  - type: tip
    content: "Many emotional expressions use Dative: 'Mir ist wichtig' (It's important to me), 'Mir fehlt er' (I miss him), 'Es geht mir gut' (I'm doing well)."
    order: 5

  - type: tip
    content: "'Wenn ich wäre..., würde ich...' is the standard structure for hypothetical 'if' statements. It uses Konjunktiv II in both clauses."
    order: 6

  - type: practice
    content: "Test your knowledge of complex family vocabulary!"
    exercise_id: "ex-mc-fam-001"
    order: 7

exercises:
  - id: ex-mc-fam-001
    type: multiple_choice
    question: "Which verb means 'to reconcile with'?"
    options:
      - sich streiten mit
      - sich verstehen mit
      - sich versöhnen mit
      - sich trennen von
    correct_index: 2
    explanation: "'Sich versöhnen mit' means to reconcile with someone - to make peace after a conflict."

  - id: ex-fb-fam-001
    type: fill_blank
    sentence_template: "Wenn ich an _____ Stelle wäre, würde ich sie anrufen."
    correct_answer: "deiner"
    alternatives:
      - Deiner
    hint: "Possessive pronoun for 'your' in Dative case with feminine noun"

  - id: ex-tr-fam-001
    type: translate
    source_text: "I get along very well with my brother."
    target_language: "de"
    correct_translation: "Ich verstehe mich sehr gut mit meinem Bruder."
    alternatives:
      - "Mein Bruder und ich verstehen uns sehr gut."

  - id: ex-tr-fam-002
    type: translate
    source_text: "If I were you, I would apologize."
    target_language: "de"
    correct_translation: "Wenn ich du wäre, würde ich mich entschuldigen."
    alternatives:
      - "An deiner Stelle würde ich mich entschuldigen."

  - id: ex-tr-fam-003
    type: translate
    source_text: "She means a lot to me."
    target_language: "de"
    correct_translation: "Sie bedeutet mir viel."
    alternatives:
      - "Mir liegt viel an ihr."
      - "Sie ist mir sehr wichtig."
