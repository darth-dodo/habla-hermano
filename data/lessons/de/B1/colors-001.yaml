id: colors-001
title: Colors in Abstract Contexts
description: Learn color idioms, metaphors, and complex descriptive language
language: de
level: B1
estimated_minutes: 10
category: colors
tags:
  - colors
  - idioms
  - metaphors
  - abstract
vocabulary_count: 12
icon: "🎨"

steps:
  - type: instruction
    content: "Colors aren't just for objects! German has many color idioms and metaphors. Let's explore abstract uses of colors and complex descriptions with adjective declension in all cases."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: ins Schwarze treffen
        translation: to hit the bullseye / to be spot on
      - word: blau machen
        translation: to skip work/school (informal)
      - word: grün vor Neid
        translation: green with envy
      - word: rot sehen
        translation: to see red (be angry)
      - word: sich schwarz ärgern
        translation: to be extremely angry
      - word: das Blaue vom Himmel versprechen
        translation: to promise the moon
      - word: durch die rosarote Brille sehen
        translation: to see through rose-colored glasses
      - word: die graue Eminenz
        translation: the power behind the throne
      - word: schwarzfahren
        translation: to ride without a ticket
      - word: der rote Faden
        translation: the common thread / main theme
      - word: eine weiße Weste haben
        translation: to have a clean record
      - word: der Schwarzmarkt
        translation: the black market (masculine)
    order: 2

  - type: example
    content: "Mit diesem Kommentar hast du ins Schwarze getroffen."
    translation: "With that comment, you hit the nail on the head."
    order: 3

  - type: example
    content: "Sie sieht die Welt durch die rosarote Brille."
    translation: "She sees the world through rose-colored glasses."
    order: 4

  - type: tip
    content: "Many German color idioms differ from English! 'Blau machen' (to make blue) means to skip work, while 'blau sein' (to be blue) means to be drunk!"
    order: 5

  - type: tip
    content: "'Der rote Faden' (the red thread) comes from Greek mythology - Ariadne's thread that guided Theseus through the labyrinth. It means the main theme or connecting idea."
    order: 6

  - type: practice
    content: "Test your knowledge of German color idioms!"
    exercise_id: "ex-mc-col-001"
    order: 7

exercises:
  - id: ex-mc-col-001
    type: multiple_choice
    question: "What does 'blau machen' mean?"
    options:
      - to feel sad
      - to skip work/school
      - to paint something blue
      - to be drunk
    correct_index: 1
    explanation: "'Blau machen' means to skip work or school - to take an unauthorized day off."

  - id: ex-fb-col-001
    type: fill_blank
    sentence_template: "Er war grün vor _____, als er ihr neues Auto sah."
    correct_answer: "Neid"
    alternatives:
      - neid
    hint: "What emotion makes you 'green' in German?"

  - id: ex-tr-col-001
    type: translate
    source_text: "You hit the nail on the head with your answer."
    target_language: "de"
    correct_translation: "Mit deiner Antwort hast du ins Schwarze getroffen."
    alternatives:
      - "Du hast mit deiner Antwort ins Schwarze getroffen."

  - id: ex-tr-col-002
    type: translate
    source_text: "He promised the moon but delivered nothing."
    target_language: "de"
    correct_translation: "Er hat das Blaue vom Himmel versprochen, aber nichts geliefert."
    alternatives:
      - "Er versprach das Blaue vom Himmel, hat aber nichts geliefert."

  - id: ex-tr-col-003
    type: translate
    source_text: "The book lacks a common thread."
    target_language: "de"
    correct_translation: "Dem Buch fehlt der rote Faden."
    alternatives:
      - "Das Buch hat keinen roten Faden."
