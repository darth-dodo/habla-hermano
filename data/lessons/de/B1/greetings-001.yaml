id: greetings-001
title: Formal Communication and Requests
description: Master polite requests and formal communication using Konjunktiv II
language: de
level: B1
estimated_minutes: 10
category: greetings
tags:
  - greeting
  - formal
  - konjunktiv
  - polite requests
vocabulary_count: 12
icon: "👋"

steps:
  - type: instruction
    content: "Welcome to B1! Let's learn formal and polite communication. The Konjunktiv II is essential for polite requests - it softens your language and makes you sound more professional."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: Könnten Sie mir helfen?
        translation: Could you help me? (polite)
      - word: Würden Sie bitte...
        translation: Would you please...
      - word: Ich hätte gern
        translation: I would like (polite)
      - word: Dürfte ich fragen?
        translation: Might I ask?
      - word: Es wäre nett, wenn...
        translation: It would be nice if...
      - word: Hätten Sie einen Moment Zeit?
        translation: Would you have a moment?
      - word: Ich würde vorschlagen
        translation: I would suggest
      - word: Das wäre sehr freundlich
        translation: That would be very kind
      - word: Gestatten Sie?
        translation: Do you permit? (formal)
      - word: Mit Verlaub
        translation: With your permission
      - word: Ich möchte mich erkundigen
        translation: I would like to inquire
      - word: Verzeihen Sie die Störung
        translation: Pardon the interruption
    order: 2

  - type: example
    content: "Könnten Sie mir bitte sagen, wo der Ausgang ist?"
    translation: "Could you please tell me where the exit is?"
    order: 3

  - type: example
    content: "Es wäre sehr nett, wenn Sie mir dabei helfen könnten."
    translation: "It would be very nice if you could help me with this."
    order: 4

  - type: tip
    content: "Konjunktiv II forms: hätte (would have), wäre (would be), könnte (could), würde (would). These are formed from past tense with umlaut: hatte → hätte, war → wäre."
    order: 5

  - type: tip
    content: "For most verbs, use 'würde + infinitive': Ich würde gern kommen. (I would like to come.) But common verbs like haben, sein, können use their own Konjunktiv II forms."
    order: 6

  - type: practice
    content: "Test your knowledge of formal German communication!"
    exercise_id: "ex-mc-greet-001"
    order: 7

exercises:
  - id: ex-mc-greet-001
    type: multiple_choice
    question: "Which is the most polite way to ask for help?"
    options:
      - Helfen Sie mir!
      - Können Sie mir helfen?
      - Könnten Sie mir bitte helfen?
      - Hilf mir!
    correct_index: 2
    explanation: "Könnten Sie mir bitte helfen? uses Konjunktiv II (könnten) plus 'bitte', making it the most polite form."

  - id: ex-fb-greet-001
    type: fill_blank
    sentence_template: "Ich _____ gern einen Kaffee bestellen."
    correct_answer: "hätte"
    alternatives:
      - Hätte
    hint: "Konjunktiv II of 'haben' for polite 'I would like'"

  - id: ex-tr-greet-001
    type: translate
    source_text: "Could you please repeat that?"
    target_language: "de"
    correct_translation: "Könnten Sie das bitte wiederholen?"
    alternatives:
      - "Würden Sie das bitte wiederholen?"

  - id: ex-tr-greet-002
    type: translate
    source_text: "I would like to make a reservation."
    target_language: "de"
    correct_translation: "Ich hätte gern eine Reservierung."
    alternatives:
      - "Ich möchte gern eine Reservierung machen."
      - "Ich würde gern eine Reservierung machen."

  - id: ex-tr-greet-003
    type: translate
    source_text: "Would you have time for a meeting tomorrow?"
    target_language: "de"
    correct_translation: "Hätten Sie morgen Zeit für ein Treffen?"
    alternatives:
      - "Würden Sie morgen Zeit für ein Treffen haben?"
