id: introductions-001
title: Talking About Your Life
description: Learn to discuss your job, hobbies, and daily routine
language: de
level: A2
estimated_minutes: 7
category: introductions
tags:
  - introduction
  - occupation
  - hobbies
  - daily routine
vocabulary_count: 10
icon: "🙋"

steps:
  - type: instruction
    content: "Let's learn to talk about your life! You'll discuss your job, hobbies, and daily activities using modal verbs (können, müssen, wollen) and the Perfekt tense."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: Was machen Sie beruflich?
        translation: What do you do for work? (formal)
      - word: Ich arbeite als
        translation: I work as
      - word: der Lehrer / die Lehrerin
        translation: the teacher (m/f)
      - word: der Arzt / die Ärztin
        translation: the doctor (m/f)
      - word: Ich muss arbeiten
        translation: I have to work
      - word: Ich kann schwimmen
        translation: I can swim
      - word: Ich will reisen
        translation: I want to travel
      - word: das Hobby
        translation: the hobby (neuter)
      - word: In meiner Freizeit
        translation: In my free time
      - word: Ich habe studiert
        translation: I studied (Perfekt)
    order: 2

  - type: example
    content: "Was machen Sie beruflich? - Ich arbeite als Lehrerin."
    translation: "What do you do for work? - I work as a teacher."
    order: 3

  - type: example
    content: "In meiner Freizeit spiele ich gern Fußball."
    translation: "In my free time, I like to play soccer."
    order: 4

  - type: tip
    content: "Modal verbs (müssen, können, wollen) push the main verb to the end in infinitive form: 'Ich muss heute arbeiten.' (I have to work today.)"
    order: 5

  - type: tip
    content: "Many professions have masculine and feminine forms: Lehrer/Lehrerin, Arzt/Ärztin. The feminine usually adds '-in' to the masculine form."
    order: 6

  - type: practice
    content: "Test your knowledge of talking about your life!"
    exercise_id: "ex-mc-intro-001"
    order: 7

exercises:
  - id: ex-mc-intro-001
    type: multiple_choice
    question: "Which modal verb means 'must' or 'have to'?"
    options:
      - können
      - wollen
      - müssen
      - dürfen
    correct_index: 2
    explanation: "Müssen means 'must' or 'have to'. Können = can, wollen = want to, dürfen = may/be allowed to."

  - id: ex-fb-intro-001
    type: fill_blank
    sentence_template: "Ich _____ als Arzt in einem Krankenhaus."
    correct_answer: "arbeite"
    alternatives:
      - Arbeite
    hint: "Which verb means 'to work'?"

  - id: ex-tr-intro-001
    type: translate
    source_text: "I have to work tomorrow."
    target_language: "de"
    correct_translation: "Ich muss morgen arbeiten."
    alternatives:
      - "Morgen muss ich arbeiten."

  - id: ex-tr-intro-002
    type: translate
    source_text: "In my free time, I like to read."
    target_language: "de"
    correct_translation: "In meiner Freizeit lese ich gern."
    alternatives:
      - "Ich lese gern in meiner Freizeit."
