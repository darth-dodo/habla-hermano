id: colors-001
title: Colors and Descriptions
description: Learn to describe objects and people using colors and adjectives
language: de
level: A2
estimated_minutes: 7
category: colors
tags:
  - colors
  - adjectives
  - description
  - accusative
vocabulary_count: 10
icon: "🎨"

steps:
  - type: instruction
    content: "Let's master adjective endings! When describing things in German, adjectives change based on the article, case, and gender. We'll focus on Nominative and Accusative cases."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: bunt
        translation: colorful
      - word: einfarbig
        translation: single-colored/solid
      - word: gestreift
        translation: striped
      - word: gepunktet
        translation: polka-dotted
      - word: der blaue Himmel
        translation: the blue sky (Nominative)
      - word: einen roten Apfel
        translation: a red apple (Accusative)
      - word: hübsch
        translation: pretty
      - word: hässlich
        translation: ugly
      - word: die weiße Wand
        translation: the white wall
      - word: das schwarze Auto
        translation: the black car
    order: 2

  - type: example
    content: "Ich kaufe einen grünen Pullover."
    translation: "I'm buying a green sweater. (Accusative)"
    order: 3

  - type: example
    content: "Das bunte Kleid ist sehr hübsch."
    translation: "The colorful dress is very pretty."
    order: 4

  - type: tip
    content: "With definite articles (der/die/das), adjectives add '-e' or '-en': der blaue Himmel (Nom.), den blauen Himmel (Acc.). In Accusative, masculine nouns get extra endings!"
    order: 5

  - type: tip
    content: "Pattern words like 'gestreift' (striped) and 'gepunktet' (dotted) are past participles used as adjectives. They follow the same ending rules!"
    order: 6

  - type: practice
    content: "Test your knowledge of German color descriptions!"
    exercise_id: "ex-mc-col-001"
    order: 7

exercises:
  - id: ex-mc-col-001
    type: multiple_choice
    question: "Which is correct for 'the red car' in Accusative?"
    options:
      - der rote Auto
      - das rote Auto
      - den roten Auto
      - das roten Auto
    correct_index: 1
    explanation: "Das rote Auto - 'Auto' is neuter, and neuter nouns don't change their article in Accusative. The adjective takes '-e'."

  - id: ex-fb-col-001
    type: fill_blank
    sentence_template: "Ich sehe einen _____ Vogel. (yellow)"
    correct_answer: "gelben"
    alternatives:
      - Gelben
    hint: "Masculine + Accusative + 'einen' = adjective ends in '-en'"

  - id: ex-tr-col-001
    type: translate
    source_text: "The white house is beautiful."
    target_language: "de"
    correct_translation: "Das weiße Haus ist schön."
    alternatives:
      - "Das weisse Haus ist schön."

  - id: ex-tr-col-002
    type: translate
    source_text: "I like the colorful painting."
    target_language: "de"
    correct_translation: "Ich mag das bunte Bild."
    alternatives:
      - "Das bunte Bild gefällt mir."
