id: family-001
title: Extended Family
description: Learn more family members and possessive pronouns
language: de
level: A1
estimated_minutes: 5
category: family
tags:
  - family
  - possessive
  - nouns
  - relationships
vocabulary_count: 8
icon: "👨‍👩‍👧‍👦"

steps:
  - type: instruction
    content: "Let's expand your family vocabulary! You'll learn grandparents, aunt, uncle, and how to use possessive pronouns (mein, dein) to talk about your family."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: die Großmutter / die Oma
        translation: the grandmother / grandma (feminine)
      - word: der Großvater / der Opa
        translation: the grandfather / grandpa (masculine)
      - word: die Tante
        translation: the aunt (feminine)
      - word: der Onkel
        translation: the uncle (masculine)
      - word: der Cousin
        translation: the male cousin (masculine)
      - word: die Cousine
        translation: the female cousin (feminine)
      - word: mein / meine
        translation: my (masculine-neuter / feminine)
      - word: dein / deine
        translation: your (masculine-neuter / feminine, informal)
    order: 2

  - type: example
    content: "Meine Großmutter wohnt in Hamburg."
    translation: "My grandmother lives in Hamburg."
    order: 3

  - type: example
    content: "Wie heißt dein Onkel?"
    translation: "What is your uncle's name?"
    order: 4

  - type: tip
    content: "Possessives match the noun's gender: 'mein Bruder' (my brother, masc.) vs 'meine Schwester' (my sister, fem.) vs 'mein Kind' (my child, neuter)."
    order: 5

  - type: tip
    content: "Oma and Opa are affectionate terms like 'grandma' and 'grandpa'. Großmutter and Großvater are more formal."
    order: 6

  - type: practice
    content: "Test your knowledge of German family words!"
    exercise_id: "ex-mc-fam-001"
    order: 7

exercises:
  - id: ex-mc-fam-001
    type: multiple_choice
    question: "What is 'die Tante' in English?"
    options:
      - the grandmother
      - the aunt
      - the cousin
      - the mother
    correct_index: 1
    explanation: "Die Tante means 'the aunt' in German. It's a feminine noun."

  - id: ex-mc-fam-002
    type: multiple_choice
    question: "Which possessive goes with 'Schwester' (sister)?"
    options:
      - mein Schwester
      - meine Schwester
      - meinen Schwester
      - meiner Schwester
    correct_index: 1
    explanation: "Meine Schwester - 'Schwester' is feminine, so the possessive needs the -e ending."

  - id: ex-fb-fam-001
    type: fill_blank
    sentence_template: "_____ Großvater ist 80 Jahre alt."
    correct_answer: "Mein"
    alternatives:
      - mein
    hint: "What possessive pronoun for 'my' goes with masculine nouns?"

  - id: ex-fb-fam-002
    type: fill_blank
    sentence_template: "Wie heißt _____ Cousine?"
    correct_answer: "deine"
    alternatives:
      - Deine
    hint: "What possessive for 'your' (informal) goes with feminine nouns?"
