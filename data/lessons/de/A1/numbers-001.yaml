id: numbers-001
title: Numbers 11-100
description: Learn larger numbers and how to use them in German
language: de
level: A1
estimated_minutes: 5
category: numbers
tags:
  - numbers
  - counting
  - mathematics
  - age
vocabulary_count: 8
icon: "🔢"

steps:
  - type: instruction
    content: "Let's learn bigger numbers! German numbers follow a unique pattern: for numbers 21-99, you say the ones digit first, then 'und' (and), then the tens. Twenty-one is 'einundzwanzig' (one-and-twenty)!"
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: elf
        translation: eleven (11)
      - word: zwölf
        translation: twelve (12)
      - word: zwanzig
        translation: twenty (20)
      - word: dreißig
        translation: thirty (30)
      - word: fünfzig
        translation: fifty (50)
      - word: hundert
        translation: hundred (100)
      - word: einundzwanzig
        translation: twenty-one (21)
      - word: fünfunddreißig
        translation: thirty-five (35)
    order: 2

  - type: example
    content: "Ich bin fünfundzwanzig Jahre alt."
    translation: "I am twenty-five years old."
    order: 3

  - type: example
    content: "Das kostet dreiundfünfzig Euro."
    translation: "That costs fifty-three euros."
    order: 4

  - type: tip
    content: "German compound numbers are written as one word! 'Fünfunddreißig' (35) = fünf (5) + und (and) + dreißig (30). The ones come first!"
    order: 5

  - type: tip
    content: "Notice that 'dreißig' (30) uses 'ß' not 'z' - it's the only -zig number that doesn't end in '-zig' but '-ßig'!"
    order: 6

  - type: practice
    content: "Test your knowledge of German numbers!"
    exercise_id: "ex-mc-num-001"
    order: 7

exercises:
  - id: ex-mc-num-001
    type: multiple_choice
    question: "What is 'zwölf' in numbers?"
    options:
      - "2"
      - "11"
      - "12"
      - "20"
    correct_index: 2
    explanation: "Zwölf means 12. It comes from the same root as 'twelve' in English!"

  - id: ex-mc-num-002
    type: multiple_choice
    question: "How do you say 45 in German?"
    options:
      - vierundvierzig
      - fünfundvierzig
      - vierundfünfzig
      - fünfundfünfzig
    correct_index: 1
    explanation: "45 is fünfundvierzig: fünf (5) + und + vierzig (40). Remember: ones first, then tens!"

  - id: ex-fb-num-001
    type: fill_blank
    sentence_template: "Ich bin _____ Jahre alt. (23)"
    correct_answer: "dreiundzwanzig"
    alternatives:
      - Dreiundzwanzig
    hint: "Three-and-twenty: drei + und + zwanzig"

  - id: ex-fb-num-002
    type: fill_blank
    sentence_template: "Das kostet _____ Euro. (100)"
    correct_answer: "hundert"
    alternatives:
      - Hundert
      - einhundert
    hint: "How do you say 'one hundred'?"
