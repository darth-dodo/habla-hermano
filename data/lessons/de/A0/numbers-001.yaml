id: numbers-001
title: Numbers 1-10
description: Learn to count from one to ten in German
language: de
level: A0
estimated_minutes: 3
category: numbers
tags:
  - numbers
  - basics
  - counting
  - mathematics
vocabulary_count: 6
icon: "🔢"

steps:
  - type: instruction
    content: "Numbers are essential! Let's learn to count from 1 to 10 in German. German numbers are similar to English for the first few!"
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: eins
        translation: one (1)
      - word: zwei
        translation: two (2)
      - word: drei
        translation: three (3)
      - word: vier
        translation: four (4)
      - word: fünf
        translation: five (5)
      - word: sechs
        translation: six (6)
    order: 2

  - type: example
    content: "Eins, zwei, drei!"
    translation: "One, two, three!"
    order: 3

  - type: example
    content: "Ich habe drei Äpfel."
    translation: "I have three apples."
    order: 4

  - type: tip
    content: "Notice that 'zwei' sounds like 'tsvy' - the 'z' in German is pronounced like 'ts'. And 'fünf' has an umlaut (ü)!"
    order: 5

  - type: tip
    content: "The numbers 7-10 are: sieben (7), acht (8), neun (9), zehn (10). Practice them too!"
    order: 6

  - type: practice
    content: "Test your knowledge of German numbers!"
    exercise_id: "ex-mc-num-001"
    order: 7

exercises:
  - id: ex-mc-num-001
    type: multiple_choice
    question: "What is 'three' in German?"
    options:
      - zwei
      - drei
      - vier
      - fünf
    correct_index: 1
    explanation: "Drei means 'three' in German."

  - id: ex-mc-num-002
    type: multiple_choice
    question: "Which number is 'fünf'?"
    options:
      - "3"
      - "4"
      - "5"
      - "6"
    correct_index: 2
    explanation: "Fünf means 'five' in German. Note the umlaut ü!"

  - id: ex-mc-num-003
    type: multiple_choice
    question: "How do you say 'two' in German?"
    options:
      - eins
      - zwei
      - zehn
      - sechs
    correct_index: 1
    explanation: "Zwei means 'two' in German. The 'z' is pronounced like 'ts'."
