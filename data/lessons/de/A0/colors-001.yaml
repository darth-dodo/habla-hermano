id: colors-001
title: Basic Colors
description: Learn the most common colors in German
language: de
level: A0
estimated_minutes: 3
category: colors
tags:
  - colors
  - basics
  - adjectives
  - description
vocabulary_count: 6
icon: "🎨"

steps:
  - type: instruction
    content: "Colors are everywhere! Let's learn the most common colors in German. Colors are adjectives and don't need to be capitalized unless they start a sentence."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: rot
        translation: red
      - word: blau
        translation: blue
      - word: grün
        translation: green
      - word: gelb
        translation: yellow
      - word: schwarz
        translation: black
      - word: weiß
        translation: white
    order: 2

  - type: example
    content: "Die Tomate ist rot."
    translation: "The tomato is red."
    order: 3

  - type: example
    content: "Der Himmel ist blau."
    translation: "The sky is blue."
    order: 4

  - type: tip
    content: "Notice 'grün' has an umlaut (ü). This changes the pronunciation! And 'weiß' uses the special German letter ß (eszett), which sounds like 'ss'."
    order: 5

  - type: tip
    content: "When colors come before a noun, they need endings: 'ein roter Apfel' (a red apple). For now, just learn the basic forms!"
    order: 6

  - type: practice
    content: "Test your knowledge of German colors!"
    exercise_id: "ex-mc-col-001"
    order: 7

exercises:
  - id: ex-mc-col-001
    type: multiple_choice
    question: "What color is 'blau'?"
    options:
      - red
      - green
      - blue
      - yellow
    correct_index: 2
    explanation: "Blau means 'blue' in German."

  - id: ex-mc-col-002
    type: multiple_choice
    question: "How do you say 'green' in German?"
    options:
      - gelb
      - grün
      - rot
      - weiß
    correct_index: 1
    explanation: "Grün means 'green' in German. Notice the umlaut ü!"

  - id: ex-mc-col-003
    type: multiple_choice
    question: "Which word means 'black'?"
    options:
      - weiß
      - blau
      - schwarz
      - rot
    correct_index: 2
    explanation: "Schwarz means 'black' in German. Weiß means 'white' - the opposite!"
