id: greetings-001
title: Basic Greetings
description: Learn to say hello and goodbye in German
language: de
level: A0
estimated_minutes: 3
category: greetings
tags:
  - greeting
  - basics
  - hello
  - goodbye
vocabulary_count: 6
icon: "👋"

steps:
  - type: instruction
    content: "Willkommen! Welcome to your first German lesson! Greetings are the foundation of any conversation. Let's learn how to say hello and goodbye."
    order: 1

  - type: vocabulary
    content: "Key vocabulary for this lesson:"
    vocabulary:
      - word: Hallo
        translation: hello
      - word: Tschüss
        translation: goodbye (informal)
      - word: Guten Morgen
        translation: good morning
      - word: Guten Tag
        translation: good day/hello (formal)
      - word: Guten Abend
        translation: good evening
      - word: Auf Wiedersehen
        translation: goodbye (formal)
    order: 2

  - type: example
    content: "Hallo, wie geht's?"
    translation: "Hello, how are you? (informal)"
    order: 3

  - type: example
    content: "Guten Morgen, Herr Schmidt."
    translation: "Good morning, Mr. Schmidt."
    order: 4

  - type: tip
    content: "Guten Tag is the most formal daytime greeting. Use Hallo with friends and Guten Tag in professional settings or with strangers."
    order: 5

  - type: tip
    content: "Germans often say Tschüss (casual) or Auf Wiedersehen (formal) when leaving. Tschüss is pronounced like 'choos'!"
    order: 6

  - type: practice
    content: "Test your knowledge of German greetings!"
    exercise_id: "ex-mc-greet-001"
    order: 7

exercises:
  - id: ex-mc-greet-001
    type: multiple_choice
    question: "How do you say 'hello' in German?"
    options:
      - Hallo
      - Tschüss
      - Danke
      - Bitte
    correct_index: 0
    explanation: "Hallo means 'hello' in German and is used in casual situations."

  - id: ex-mc-greet-002
    type: multiple_choice
    question: "What greeting would you use at a business meeting?"
    options:
      - Tschüss
      - Hallo
      - Guten Tag
      - Auf Wiedersehen
    correct_index: 2
    explanation: "Guten Tag is formal and appropriate for business contexts."

  - id: ex-mc-greet-003
    type: multiple_choice
    question: "How do you say 'goodbye' formally in German?"
    options:
      - Hallo
      - Guten Tag
      - Tschüss
      - Auf Wiedersehen
    correct_index: 3
    explanation: "Auf Wiedersehen is the formal way to say goodbye. It literally means 'until we see each other again'."
