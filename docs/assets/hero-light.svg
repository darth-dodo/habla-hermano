      <g fill="none" stroke="#1D4ED8" stroke-width="1.4" opacity="0.07">
        <rect x="0.7" y="0.7" width="46.6" height="46.6"/>
        <path d="M24 4 L44 24 L24 44 L4 24 Z"/>
        <circle cx="24" cy="24" r="7"/>
        <path d="M0 0 L10 10 M48 0 L38 10 M0 48 L10 38 M48 48 L38 38"/>
      </g>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FBF8F4" stop-opacity="1"/>
      <stop offset="0.38" stop-color="#FBF8F4" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#FBF8F4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="#FBF8F4"/>
