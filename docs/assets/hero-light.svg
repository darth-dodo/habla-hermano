  <g font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="64" y="84" width="64" height="64" rx="16" fill="#1D4ED8"/>
    <svg x="80" y="100" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
    <text x="64" y="208" font-size="58" font-weight="700" letter-spacing="-1.2" fill="#1E293B">Habla Hermano</text>
    <text x="66" y="246" font-size="22" font-weight="500" fill="#4B5563">Talk your way from A0 to B1, with a big brother who never judges.</text>
    <rect x="64" y="268" width="71" height="28" rx="14" fill="rgba(29,78,216,0.10)"/><text x="100" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">Español</text><rect x="145.39999999999998" y="268" width="71" height="28" rx="14" fill="rgba(29,78,216,0.10)"/><text x="181" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">Deutsch</text><rect x="226.79999999999995" y="268" width="80" height="28" rx="14" fill="rgba(29,78,216,0.10)"/><text x="267" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">Français</text><rect x="316.4" y="268" width="80" height="28" rx="14" fill="rgba(29,78,216,0.10)"/><text x="356" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">Hinglish</text>

    <g>
      <rect x="742" y="76" width="420" height="96" rx="20" fill="#FFFFFF" stroke="#D4CFC6"/>
      <text x="766" y="114" font-size="19" font-weight="700" fill="#1E293B">¡Hola! <tspan font-weight="500">I'm Hermano. How do you</tspan></text>
      <text x="766" y="144" font-size="19" font-weight="500" fill="#1E293B">say your name? Try <tspan font-weight="700" fill="#1D4ED8">Me llamo...</tspan></text>
      <text x="762" y="214" font-size="12" font-weight="700" letter-spacing="1.4" fill="#4B5563">WORD BANK</text>
      <rect x="762" y="228" width="80" height="28" rx="14" fill="rgba(29,78,216,0.10)"/><text x="802" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">me llamo</text><rect x="849.6" y="228" width="39" height="28" rx="14" fill="rgba(29,78,216,0.10)"/><text x="869" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">soy</text><rect x="896.2" y="228" width="104" height="28" rx="14" fill="rgba(29,78,216,0.10)"/><text x="948" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">mucho gusto</text>
      <rect x="852" y="284" width="310" height="54" rx="20" fill="#2563EB"/>
      <text x="1007" y="318" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Me llamo Ana. ¡Mucho gusto!</text>
