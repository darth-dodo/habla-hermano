    <circle cx="700" cy="200" r="22" fill="#2A1F18" stroke="#E07A5F" stroke-width="2.5"/><text x="700" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#E07A5F">A0</text><rect x="650" y="244" width="100" height="8" rx="4" fill="rgba(224,122,95,0.16)"/><rect x="650" y="244" width="20" height="8" rx="4" fill="#E07A5F"/><text x="700" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#F2E8DE">20% target</text><text x="700" y="296" text-anchor="middle" font-size="12" fill="#D4BC9E">one word at a time</text><circle cx="850" cy="200" r="22" fill="#2A1F18" stroke="#E07A5F" stroke-width="2.5"/><text x="850" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#E07A5F">A1</text><rect x="800" y="244" width="100" height="8" rx="4" fill="rgba(224,122,95,0.16)"/><rect x="800" y="244" width="50" height="8" rx="4" fill="#E07A5F"/><text x="850" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#F2E8DE">50% target</text><text x="850" y="296" text-anchor="middle" font-size="12" fill="#D4BC9E">short sentences</text><circle cx="1000" cy="200" r="22" fill="#2A1F18" stroke="#E07A5F" stroke-width="2.5"/><text x="1000" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#E07A5F">A2</text><rect x="950" y="244" width="100" height="8" rx="4" fill="rgba(224,122,95,0.16)"/><rect x="950" y="244" width="80" height="8" rx="4" fill="#E07A5F"/><text x="1000" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#F2E8DE">80% target</text><text x="1000" y="296" text-anchor="middle" font-size="12" fill="#D4BC9E">past tense, stories</text><circle cx="1150" cy="200" r="22" fill="#E07A5F" stroke="#E07A5F" stroke-width="2.5"/><text x="1150" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1410">B1</text><rect x="1100" y="244" width="100" height="8" rx="4" fill="rgba(224,122,95,0.16)"/><rect x="1100" y="244" width="95" height="8" rx="4" fill="#E07A5F"/><text x="1150" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#F2E8DE">95% target</text><text x="1150" y="296" text-anchor="middle" font-size="12" fill="#D4BC9E">real conversations</text>
