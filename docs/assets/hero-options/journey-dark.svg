    <text x="64" y="220" font-size="54" font-weight="700" letter-spacing="-1.2" fill="#F2E8DE">Habla Hermano</text>
    <text x="66" y="256" font-size="20" font-weight="500" fill="#D4BC9E">An AI conversation partner that grows with you.</text>
    <text x="66" y="296" font-size="15" font-weight="600" fill="#E07A5F">Español  ·  Deutsch  ·  Français  ·  Hinglish</text>
