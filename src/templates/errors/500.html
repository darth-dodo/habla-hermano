{% extends "base.html" %}

{% block title %}Server Error - Habla Hermano{% endblock %}

{% block content %}
<div class="min-h-full flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8 safe-top">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <!-- Icon -->
        <div class="flex justify-center">
            <div class="w-20 h-20 rounded-3xl bg-error/10 flex items-center justify-center">
                <svg class="w-12 h-12 text-error" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M12 9v3.75m0-10.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285zm0 13.036h.008v.008H12v-.008z" />
                </svg>
            </div>
        </div>

        <p class="mt-6 text-6xl font-bold text-error">500</p>
        <h1 class="mt-4 text-2xl font-bold text-text">Something went wrong</h1>
        <p class="mt-3 text-text-muted">
            An unexpected error occurred. Our team has been notified.
        </p>

        <!-- Actions -->
        <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="/"
               class="w-full sm:w-auto inline-flex justify-center items-center gap-2 py-3 px-6 bg-accent hover:bg-accent-hover text-accent-text font-medium rounded-xl transition-all duration-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                Back to Chat
            </a>
            <button onclick="location.reload()"
                    class="w-full sm:w-auto inline-flex justify-center py-3 px-6 border border-border rounded-xl text-sm font-medium text-text hover:bg-surface-overlay transition-all duration-200">
                Try Again
            </button>
        </div>
    </div>
</div>
{% endblock %}
