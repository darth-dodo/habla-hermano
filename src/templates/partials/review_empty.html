{#
Review Empty State - No words due for review
Shows when review session has no words available or session is invalid
Variables expected:
  - message: str (the message to display)
#}

<div class="text-center py-8 animate-fade-in">
    <!-- Empty State Icon -->
    <div class="w-16 h-16 bg-surface-overlay rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-8 h-8 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
        </svg>
    </div>

    <!-- Hermano's Message -->
    <div class="bg-ai rounded-2xl rounded-bl-sm px-4 py-4 sm:px-5 max-w-full sm:max-w-[85%] mx-auto mb-6 border border-border text-left">
        <p class="text-ai-text leading-relaxed">
            {{ message }}
        </p>
    </div>

    <!-- Action -->
    <div class="space-y-3 max-w-xs mx-auto">
        <a
            href="/"
            class="w-full px-6 py-3 bg-accent hover:bg-accent-hover text-accent-text font-medium rounded-xl transition-all duration-150 flex items-center justify-center gap-2 btn-press"
        >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            Back to Chat
        </a>
    </div>
</div>
