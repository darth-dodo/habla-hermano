<div class="exercise-feedback-enhanced p-4 rounded-xl {% if is_correct %}bg-green-500/10 border border-green-500/30{% else %}bg-red-500/10 border border-red-500/30{% endif %}">
    <!-- Status Header -->
    <div class="flex items-center gap-3 mb-4">
        {% if is_correct %}
        <span class="text-3xl" aria-hidden="true">&#127881;</span>
        <div>
            <h4 class="font-bold text-green-400 text-lg">Correct!</h4>
            <p class="text-sm text-text-muted">Great job!</p>
        </div>
        {% else %}
        <span class="text-3xl" aria-hidden="true">&#128170;</span>
        <div>
            <h4 class="font-bold text-red-400 text-lg">Not quite...</h4>
            <p class="text-sm text-text-muted">Keep trying!</p>
        </div>
        {% endif %}
    </div>

    <!-- Hermano's Personalized Feedback -->
    {% if feedback %}
    <div class="bg-surface-elevated rounded-lg p-4 mb-4">
        <div class="flex items-start gap-3">
            <span class="text-xl flex-shrink-0" aria-hidden="true">&#129305;</span>
            <div class="text-text leading-relaxed prose prose-sm prose-invert max-w-none">
                {{ feedback | sanitize }}
            </div>
        </div>
    </div>
    {% endif %}

    <!-- Action Buttons -->
    <div class="flex gap-3 mt-4">
        {% if is_correct %}
        <button
            type="button"
            class="flex-1 px-4 py-2 bg-accent hover:bg-accent-hover text-accent-text font-medium rounded-lg transition-colors flex items-center justify-center gap-2"
            onclick="document.getElementById('next-btn')?.click()"
        >
            Continue
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </button>
        {% else %}
        <button
            type="button"
            class="flex-1 px-4 py-2 bg-accent hover:bg-accent-hover text-accent-text font-medium rounded-lg transition-colors"
            hx-get="/lessons/{{ lesson_id }}/exercise/{{ exercise_id }}"
            hx-target="closest .exercise, closest .exercise-container"
            hx-swap="innerHTML"
        >
            Try Again
        </button>
        <button
            type="button"
            class="px-4 py-2 border border-border text-text-muted hover:text-text hover:bg-surface-elevated rounded-lg transition-colors"
            onclick="document.getElementById('next-btn')?.click()"
        >
            Skip
        </button>
        {% endif %}
    </div>
</div>
