<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Habla Hermano - Your AI Spanish Language Tutor">
    <meta name="theme-color" content="#1a1a1a">
    <title>{% block title %}Habla Hermano{% endblock %}</title>

    <!-- Tailwind CSS CDN (development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Theme-aware colors using CSS variables
                        surface: {
                            DEFAULT: 'var(--surface)',
                            elevated: 'var(--surface-elevated)',
                            overlay: 'var(--surface-overlay)',
                        },
                        border: {
                            DEFAULT: 'var(--border)',
                            subtle: 'var(--border-subtle)',
                        },
                        text: {
                            DEFAULT: 'var(--text)',
                            muted: 'var(--text-muted)',
                            subtle: 'var(--text-subtle)',
                        },
                        accent: {
                            DEFAULT: 'var(--accent)',
                            hover: 'var(--accent-hover)',
                            muted: 'var(--accent-muted)',
                            text: 'var(--accent-text)',
                        },
                        user: {
                            DEFAULT: 'var(--user-bubble)',
                            text: 'var(--user-text)',
                        },
                        ai: {
                            DEFAULT: 'var(--ai-bubble)',
                            text: 'var(--ai-text)',
                        },
                        success: {
                            DEFAULT: 'var(--success)',
                            muted: 'var(--success-muted)',
                        },
                        error: {
                            DEFAULT: 'var(--error)',
                            muted: 'var(--error-muted)',
                        },
                    },
                    fontFamily: {
                        display: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'pulse-subtle': 'pulseSubtle 2s ease-in-out infinite',
                        'warm-glow': 'warmGlow 0.6s ease-out',
                        'check-draw': 'checkDraw 0.4s ease-out forwards',
                        'gentle-bounce': 'gentleBounce 0.5s ease-out',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(12px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseSubtle: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.6' },
                        },
                        warmGlow: {
                            '0%': { boxShadow: '0 0 0 0 var(--accent-muted)' },
                            '50%': { boxShadow: '0 0 20px 4px var(--accent-muted)' },
                            '100%': { boxShadow: '0 0 0 0 var(--accent-muted)' },
                        },
                        checkDraw: {
                            '0%': { strokeDashoffset: '24' },
                            '100%': { strokeDashoffset: '0' },
                        },
                        gentleBounce: {
                            '0%': { transform: 'scale(0.95)' },
                            '50%': { transform: 'scale(1.02)' },
                            '100%': { transform: 'scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-4px)' },
                        },
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    },
                    boxShadow: {
                        'warm-sm': '0 1px 3px var(--shadow-color), 0 1px 2px var(--shadow-color)',
                        'warm': '0 4px 12px var(--shadow-color), 0 2px 4px var(--shadow-color)',
                        'warm-lg': '0 8px 24px var(--shadow-color), 0 4px 8px var(--shadow-color)',
                        'warm-xl': '0 16px 40px var(--shadow-color), 0 8px 16px var(--shadow-color)',
                        'inner-warm': 'inset 0 2px 4px var(--shadow-color)',
                    },
                }
            }
        }
    </script>

    <!-- Inter (display) + Inter (body) fonts - Clean Nordic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>

    <!-- Alpine.js for minimal interactivity -->
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <!-- Theme System -->
    <style>
        /* ============================================
           NORDIC MINIMAL DESIGN SYSTEM
           Clean, crisp, modern Scandinavian aesthetic
           ============================================ */

        /* Light Theme (default) - Nordic Day: Pure whites, cool grays, ice blue */
        :root, [data-theme="light"] {
            --surface: #FAFBFC;
            --surface-elevated: #FFFFFF;
            --surface-overlay: #F3F5F7;
            --border: #E1E5EA;
            --border-subtle: #EBEEF2;
            --text: #1A1F26;
            --text-muted: #5C6670;
            --text-subtle: #8B939E;
            --accent: #3B82F6;
            --accent-hover: #2563EB;
            --accent-muted: rgba(59, 130, 246, 0.1);
            --accent-text: #FFFFFF;
            --user-bubble: #3B82F6;
            --user-text: #FFFFFF;
            --ai-bubble: #F3F5F7;
            --ai-text: #1A1F26;
            --success: #10B981;
            --success-muted: rgba(16, 185, 129, 0.1);
            --error: #EF4444;
            --error-muted: rgba(239, 68, 68, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.04);
            --scrollbar-track: #F3F5F7;
            --scrollbar-thumb: #D1D5DB;
            --scrollbar-thumb-hover: #B8BFC9;
            --paper-texture: none;
        }

        /* Dark Theme - Nordic Night: Deep charcoal, soft whites, ice blue */
        [data-theme="dark"] {
            --surface: #0F1115;
            --surface-elevated: #1A1D23;
            --surface-overlay: #252930;
            --border: #353A42;
            --border-subtle: #2A2F37;
            --text: #F0F2F5;
            --text-muted: #9CA3AF;
            --text-subtle: #6B7280;
            --accent: #60A5FA;
            --accent-hover: #93C5FD;
            --accent-muted: rgba(96, 165, 250, 0.15);
            --accent-text: #0F1115;
            --user-bubble: #3B82F6;
            --user-text: #FFFFFF;
            --ai-bubble: #1A1D23;
            --ai-text: #F0F2F5;
            --success: #34D399;
            --success-muted: rgba(52, 211, 153, 0.15);
            --error: #F87171;
            --error-muted: rgba(248, 113, 113, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --scrollbar-track: #0F1115;
            --scrollbar-thumb: #353A42;
            --scrollbar-thumb-hover: #454B55;
            --paper-texture: none;
        }

        /* Ocean Theme - Arctic Ocean: Deep navy, glacier accents */
        [data-theme="ocean"] {
            --surface: #0C1222;
            --surface-elevated: #141D2E;
            --surface-overlay: #1E293B;
            --border: #334155;
            --border-subtle: #283548;
            --text: #E2E8F0;
            --text-muted: #94A3B8;
            --text-subtle: #64748B;
            --accent: #38BDF8;
            --accent-hover: #7DD3FC;
            --accent-muted: rgba(56, 189, 248, 0.15);
            --accent-text: #0C1222;
            --user-bubble: #0EA5E9;
            --user-text: #FFFFFF;
            --ai-bubble: #141D2E;
            --ai-text: #E2E8F0;
            --success: #2DD4BF;
            --success-muted: rgba(45, 212, 191, 0.15);
            --error: #FB7185;
            --error-muted: rgba(251, 113, 133, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.5);
            --scrollbar-track: #0C1222;
            --scrollbar-thumb: #334155;
            --scrollbar-thumb-hover: #475569;
            --paper-texture: none;
        }

        /* ============================================
           BASE STYLES
           ============================================ */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--surface);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Paper texture overlay for light theme */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: var(--paper-texture);
            opacity: 0.02;
            pointer-events: none;
            z-index: 9999;
        }

        /* Display font for headings */
        h1, h2, h3, .font-display {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* Target language words get special treatment */
        .target-word, em, i {
            font-family: 'Fraunces', Georgia, serif;
            font-style: italic;
            color: var(--accent);
        }

        /* Selection */
        ::selection {
            background-color: var(--accent-muted);
            color: var(--text);
        }

        /* Focus styles - warm glow instead of harsh ring */
        :focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-muted), 0 0 0 1px var(--accent);
        }

        /* Links */
        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        a:hover {
            color: var(--accent-hover);
        }

        /* ============================================
           SCROLLBAR STYLING
           ============================================ */

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }

        /* ============================================
           ALPINE.JS UTILITIES
           ============================================ */

        /* Hide elements with x-cloak until Alpine.js initializes */
        [x-cloak] {
            display: none !important;
        }

        /* ============================================
           ANIMATIONS - Subtle & Warm
           ============================================ */

        .message-enter {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Loading dots - like coffee percolating */
        .loading-dots span {
            animation: loadingDot 1.6s infinite ease-in-out both;
            background-color: var(--accent);
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes loadingDot {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Streaming cursor - blinking caret for token-by-token display */
        .streaming-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: var(--accent);
            animation: cursorBlink 0.7s infinite;
            vertical-align: text-bottom;
            margin-left: 1px;
        }

        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Success state - warm glow */
        .success-glow {
            animation: warmGlow 0.6s ease-out;
        }

        @keyframes warmGlow {
            0% { box-shadow: 0 0 0 0 var(--success-muted); }
            50% { box-shadow: 0 0 20px 4px var(--success-muted); }
            100% { box-shadow: 0 0 0 0 var(--success-muted); }
        }

        /* Check mark draw animation */
        .check-draw {
            stroke-dasharray: 24;
            stroke-dashoffset: 24;
            animation: checkDraw 0.4s ease-out 0.1s forwards;
        }

        @keyframes checkDraw {
            to { stroke-dashoffset: 0; }
        }

        /* Gentle bounce for interactive elements */
        .hover-lift {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-color) 0 6px 16px;
        }
        .hover-lift:active {
            transform: translateY(0);
        }

        /* Button press feedback */
        .btn-press {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-press:active {
            transform: scale(0.97);
        }

        /* Smooth theme transitions */
        .theme-transition,
        .theme-transition *,
        .theme-transition *::before,
        .theme-transition *::after {
            transition: background-color 0.4s ease,
                        border-color 0.4s ease,
                        color 0.4s ease,
                        box-shadow 0.4s ease !important;
        }

        /* Stagger animation for lists - only on page load */
        @keyframes staggerIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .stagger-in > * {
            animation: staggerIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }
        .stagger-in > *:nth-child(1) { animation-delay: 0.05s; }
        .stagger-in > *:nth-child(2) { animation-delay: 0.1s; }
        .stagger-in > *:nth-child(3) { animation-delay: 0.15s; }
        .stagger-in > *:nth-child(4) { animation-delay: 0.2s; }
        .stagger-in > *:nth-child(5) { animation-delay: 0.25s; }
        .stagger-in > *:nth-child(6) { animation-delay: 0.3s; }
        .stagger-in > *:nth-child(7) { animation-delay: 0.35s; }
        .stagger-in > *:nth-child(8) { animation-delay: 0.4s; }

        /* Vocabulary card flip feel */
        .vocab-reveal {
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .vocab-reveal:hover {
            background-color: var(--accent-muted);
        }

        /* ============================================
           MOBILE OPTIMIZATIONS
           ============================================ */

        /* Dynamic viewport height - accounts for mobile browser chrome */
        .h-dvh {
            height: 100vh; /* fallback */
            height: 100dvh;
        }

        /* Safe area utilities for notched devices */
        .safe-top    { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .safe-x      {
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Prevent text size adjustment on orientation change */
        html { -webkit-text-size-adjust: 100%; }

        /* Prevent 300ms tap delay */
        html { touch-action: manipulation; }

        @media (max-width: 640px) {
            body {
                overscroll-behavior: none;
            }

            /* Prevent iOS input zoom (inputs < 16px trigger zoom) */
            input, select, textarea {
                font-size: 16px !important;
            }

            /* Hide scrollbar on mobile (overlay scrollbars are native) */
            ::-webkit-scrollbar { width: 0; height: 0; }
        }

        /* ============================================
           ACCESSIBILITY
           ============================================ */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============================================
           VOICE UI STYLES (Phase 17)
           ============================================ */

        /* Mic button recording state - red pulse */
        .voice-recording {
            background-color: var(--error) !important;
            color: white !important;
            animation: voicePulse 1.5s ease-in-out infinite;
        }

        @keyframes voicePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .voice-recording {
                animation: none !important;
                box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.5) !important;
            }
            .voice-bar {
                transition: none !important;
                height: 10px !important;
            }
            .voice-timer,
            .voice-processing-indicator {
                animation: none !important;
            }
            .voice-timer::before {
                animation: none !important;
            }
            .voice-spinner {
                animation-duration: 0.01ms !important;
            }
        }

        /* Interim transcript styling */
        .voice-interim {
            color: var(--text-subtle) !important;
            font-style: italic;
        }

        /* Speaker button states */
        .voice-speak-btn.voice-loading {
            opacity: 0.5;
            cursor: wait;
            pointer-events: none;
        }

        .voice-speak-btn.voice-playing {
            color: var(--accent);
        }

        /* Voice error tooltip */
        .voice-error-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--surface-elevated);
            color: var(--error, #ef4444);
            border: 1px solid var(--error, #ef4444);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            line-height: 1rem;
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 4px 12px var(--shadow-color);
            animation: tooltipFadeIn 0.2s ease-out;
        }

        .voice-error-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--error, #ef4444);
        }

        @keyframes tooltipFadeIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(4px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Audio level bars (replaces stop icon during recording) */
        .voice-level-bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            width: 20px;
            height: 20px;
        }

        .voice-bar {
            width: 3px;
            min-height: 3px;
            height: 3px;
            border-radius: 9999px;
            background-color: currentColor;
            transition: height 0.1s ease-out;
        }

        /* Recording timer pill */
        .voice-timer {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--error, #ef4444);
            color: white;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.675rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            line-height: 1.2;
            animation: tooltipFadeIn 0.2s ease-out;
        }

        .voice-timer::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
            margin-right: 4px;
            vertical-align: middle;
            animation: voicePulse 1.5s ease-in-out infinite;
        }

        /* Processing spinner (replaces icon after recording stops) */
        .voice-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-subtle, #9ca3af);
            border-top-color: var(--accent, #60a5fa);
            border-radius: 50%;
            animation: voiceSpin 0.6s linear infinite;
        }

        @keyframes voiceSpin {
            to { transform: rotate(360deg); }
        }

        /* Processing text indicator */
        .voice-processing-indicator {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--surface-elevated, #374151);
            color: var(--text-muted, #9ca3af);
            border: 1px solid var(--border, #4b5563);
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.675rem;
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            animation: tooltipFadeIn 0.2s ease-out;
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            :root {
                --border: #525252;
                --text-muted: #d6d3d1;
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="h-full antialiased font-sans" x-data="{
    theme: localStorage.getItem('hermano-theme') || 'dark',
    setTheme(newTheme) {
        this.theme = newTheme;
        localStorage.setItem('hermano-theme', newTheme);
        document.documentElement.setAttribute('data-theme', newTheme);
        document.body.classList.add('theme-transition');
        setTimeout(() => document.body.classList.remove('theme-transition'), 300);
    }
}" x-init="document.documentElement.setAttribute('data-theme', theme)">
    <div id="app" class="h-dvh flex flex-col">
        {% block content %}{% endblock %}
    </div>

    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', path='js/app.js') }}"></script>
    <script src="{{ url_for('static', path='js/stream.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
