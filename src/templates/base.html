<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Habla Hermano - Your AI Spanish Language Tutor">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>{% block title %}Habla Hermano{% endblock %}</title>

    <!-- Animate.css CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- Tailwind CSS CDN (development) -->
    <script nonce="{{ request.state.csp_nonce }}" src="https://cdn.tailwindcss.com"></script>
    <script nonce="{{ request.state.csp_nonce }}">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Theme-aware colors using CSS variables
                        surface: {
                            DEFAULT: 'var(--surface)',
                            elevated: 'var(--surface-elevated)',
                            overlay: 'var(--surface-overlay)',
                        },
                        border: {
                            DEFAULT: 'var(--border)',
                            subtle: 'var(--border-subtle)',
                        },
                        text: {
                            DEFAULT: 'var(--text)',
                            muted: 'var(--text-muted)',
                            subtle: 'var(--text-subtle)',
                        },
                        accent: {
                            DEFAULT: 'var(--accent)',
                            hover: 'var(--accent-hover)',
                            muted: 'var(--accent-muted)',
                            text: 'var(--accent-text)',
                        },
                        user: {
                            DEFAULT: 'var(--user-bubble)',
                            text: 'var(--user-text)',
                        },
                        ai: {
                            DEFAULT: 'var(--ai-bubble)',
                            text: 'var(--ai-text)',
                        },
                        success: {
                            DEFAULT: 'var(--success)',
                            muted: 'var(--success-muted)',
                        },
                        error: {
                            DEFAULT: 'var(--error)',
                            muted: 'var(--error-muted)',
                        },
                    },
                    fontFamily: {
                        display: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'pulse-subtle': 'pulseSubtle 2s ease-in-out infinite',
                        'warm-glow': 'warmGlow 0.6s ease-out',
                        'check-draw': 'checkDraw 0.4s ease-out forwards',
                        'gentle-bounce': 'gentleBounce 0.5s ease-out',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(12px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseSubtle: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.6' },
                        },
                        warmGlow: {
                            '0%': { boxShadow: '0 0 0 0 var(--accent-muted)' },
                            '50%': { boxShadow: '0 0 20px 4px var(--accent-muted)' },
                            '100%': { boxShadow: '0 0 0 0 var(--accent-muted)' },
                        },
                        checkDraw: {
                            '0%': { strokeDashoffset: '24' },
                            '100%': { strokeDashoffset: '0' },
                        },
                        gentleBounce: {
                            '0%': { transform: 'scale(0.95)' },
                            '50%': { transform: 'scale(1.02)' },
                            '100%': { transform: 'scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-4px)' },
                        },
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    },
                    boxShadow: {
                        'warm-sm': '0 1px 3px var(--shadow-color), 0 1px 2px var(--shadow-color)',
                        'warm': '0 4px 12px var(--shadow-color), 0 2px 4px var(--shadow-color)',
                        'warm-lg': '0 8px 24px var(--shadow-color), 0 4px 8px var(--shadow-color)',
                        'warm-xl': '0 16px 40px var(--shadow-color), 0 8px 16px var(--shadow-color)',
                        'inner-warm': 'inset 0 2px 4px var(--shadow-color)',
                    },
                }
            }
        }
    </script>

    <!-- Inter (display) + Inter (body) fonts - Clean Nordic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- HTMX -->
    <script nonce="{{ request.state.csp_nonce }}" src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>

    <!-- Alpine.js for minimal interactivity -->
    <script nonce="{{ request.state.csp_nonce }}" defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <!-- Theme System -->
    <style>
        /* ============================================
           SPANISH CULTURE DESIGN SYSTEM
           Four themes inspired by Spanish heritage
           ============================================ */

        /* Terracotta Theme - Andalusian Earth: Warm clay, parchment cream */
        [data-theme="terracotta"] {
            --surface: #1C1410;
            --surface-elevated: #2A1F18;
            --surface-overlay: #362A21;
            --border: #4A3B30;
            --border-subtle: #3E3028;
            --text: #F2E8DE;
            --text-muted: #BFA98F;
            --text-subtle: #8C7A66;
            --accent: #E07A5F;
            --accent-hover: #EE9A7F;
            --accent-muted: rgba(224, 122, 95, 0.15);
            --accent-text: #1C1410;
            --user-bubble: #C85A3A;
            --user-text: #FFFFFF;
            --ai-bubble: #2A1F18;
            --ai-text: #F2E8DE;
            --success: #A3B18A;
            --success-muted: rgba(163, 177, 138, 0.15);
            --error: #E76F51;
            --error-muted: rgba(231, 111, 81, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.5);
            --scrollbar-track: #1C1410;
            --scrollbar-thumb: #4A3B30;
            --scrollbar-thumb-hover: #5C4A3C;
            --paper-texture: none;
        }

        /* Flamenco Theme - Passionate Night: Red drama, black stage, gold accents */
        [data-theme="flamenco"] {
            --surface: #110A0A;
            --surface-elevated: #1E1214;
            --surface-overlay: #2D1B1E;
            --border: #4A2D32;
            --border-subtle: #3A2228;
            --text: #FAE8E8;
            --text-muted: #C9A3A8;
            --text-subtle: #8C6B70;
            --accent: #DC2626;
            --accent-hover: #EF4444;
            --accent-muted: rgba(220, 38, 38, 0.15);
            --accent-text: #FFFFFF;
            --user-bubble: #B91C1C;
            --user-text: #FFFFFF;
            --ai-bubble: #1E1214;
            --ai-text: #FAE8E8;
            --success: #CA8A04;
            --success-muted: rgba(202, 138, 4, 0.15);
            --error: #FB7185;
            --error-muted: rgba(251, 113, 133, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.6);
            --scrollbar-track: #110A0A;
            --scrollbar-thumb: #4A2D32;
            --scrollbar-thumb-hover: #5C3A40;
            --paper-texture: none;
        }

        /* Sangria Theme - Mediterranean Dusk: Wine purple, sunset amber */
        [data-theme="sangria"] {
            --surface: #1A0F1E;
            --surface-elevated: #261528;
            --surface-overlay: #331E36;
            --border: #4C2E52;
            --border-subtle: #3D2342;
            --text: #F3E8FF;
            --text-muted: #C4A5D4;
            --text-subtle: #8B6E9C;
            --accent: #C084FC;
            --accent-hover: #D8B4FE;
            --accent-muted: rgba(192, 132, 252, 0.15);
            --accent-text: #1A0F1E;
            --user-bubble: #9333EA;
            --user-text: #FFFFFF;
            --ai-bubble: #261528;
            --ai-text: #F3E8FF;
            --success: #F59E0B;
            --success-muted: rgba(245, 158, 11, 0.15);
            --error: #FB7185;
            --error-muted: rgba(251, 113, 133, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.5);
            --scrollbar-track: #1A0F1E;
            --scrollbar-thumb: #4C2E52;
            --scrollbar-thumb-hover: #5E3D64;
            --paper-texture: none;
        }

        /* Azulejo Theme (default) - Ceramic Tiles: Cobalt blue, whitewashed walls */
        :root, [data-theme="azulejo"] {
            --surface: #FBF8F4;
            --surface-elevated: #FFFFFF;
            --surface-overlay: #F0EDE7;
            --border: #D4CFC6;
            --border-subtle: #E5E0D8;
            --text: #1E293B;
            --text-muted: #4B5563;
            --text-subtle: #7C8494;
            --accent: #1D4ED8;
            --accent-hover: #1E40AF;
            --accent-muted: rgba(29, 78, 216, 0.1);
            --accent-text: #FFFFFF;
            --user-bubble: #2563EB;
            --user-text: #FFFFFF;
            --ai-bubble: #F0EDE7;
            --ai-text: #1E293B;
            --success: #059669;
            --success-muted: rgba(5, 150, 105, 0.1);
            --error: #DC2626;
            --error-muted: rgba(220, 38, 38, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.06);
            --scrollbar-track: #F0EDE7;
            --scrollbar-thumb: #D4CFC6;
            --scrollbar-thumb-hover: #B8B3AA;
            --paper-texture: none;
        }

        /* ============================================
           BASE STYLES
           ============================================ */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--surface);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Paper texture overlay for light theme */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: var(--paper-texture);
            opacity: 0.02;
            pointer-events: none;
            z-index: 9999;
        }

        /* Display font for headings */
        h1, h2, h3, .font-display {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* Target language words get special treatment */
        .target-word, em, i {
            font-family: 'Fraunces', Georgia, serif;
            font-style: italic;
            color: var(--accent);
        }

        /* Selection */
        ::selection {
            background-color: var(--accent-muted);
            color: var(--text);
        }

        /* Focus styles - warm glow instead of harsh ring */
        :focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-muted), 0 0 0 1px var(--accent);
        }

        /* Links */
        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        a:hover {
            color: var(--accent-hover);
        }

        /* ============================================
           SCROLLBAR STYLING
           ============================================ */

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }

        /* ============================================
           ALPINE.JS UTILITIES
           ============================================ */

        /* Hide elements with x-cloak until Alpine.js initializes */
        [x-cloak] {
            display: none !important;
        }

        /* ============================================
           ANIMATIONS - Subtle & Warm
           ============================================ */

        .message-enter {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Loading dots - like coffee percolating */
        .loading-dots span {
            animation: loadingDot 1.6s infinite ease-in-out both;
            background-color: var(--accent);
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes loadingDot {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Thinking indicator - shown while waiting for first SSE token */
        .thinking-indicator {
            color: var(--text-muted);
            font-style: italic;
            animation: thinkingPulse 1.5s ease-in-out infinite;
        }

        @keyframes thinkingPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Streaming cursor - blinking caret for token-by-token display */
        .streaming-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: var(--accent);
            animation: cursorBlink 0.7s infinite;
            vertical-align: text-bottom;
            margin-left: 1px;
        }

        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Success state - warm glow */
        .success-glow {
            animation: warmGlow 0.6s ease-out;
        }

        @keyframes warmGlow {
            0% { box-shadow: 0 0 0 0 var(--success-muted); }
            50% { box-shadow: 0 0 20px 4px var(--success-muted); }
            100% { box-shadow: 0 0 0 0 var(--success-muted); }
        }

        /* Check mark draw animation */
        .check-draw {
            stroke-dasharray: 24;
            stroke-dashoffset: 24;
            animation: checkDraw 0.4s ease-out 0.1s forwards;
        }

        @keyframes checkDraw {
            to { stroke-dashoffset: 0; }
        }

        /* Gentle bounce for interactive elements */
        .hover-lift {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-color) 0 6px 16px;
        }
        .hover-lift:active {
            transform: translateY(0);
        }

        /* Button press feedback */
        .btn-press {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-press:active {
            transform: scale(0.97);
        }

        /* Smooth theme transitions */
        .theme-transition,
        .theme-transition *,
        .theme-transition *::before,
        .theme-transition *::after {
            transition: background-color 0.4s ease,
                        border-color 0.4s ease,
                        color 0.4s ease,
                        box-shadow 0.4s ease !important;
        }

        /* Stagger animation for lists - only on page load */
        @keyframes staggerIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .stagger-in > * {
            animation: staggerIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }
        .stagger-in > *:nth-child(1) { animation-delay: 0.05s; }
        .stagger-in > *:nth-child(2) { animation-delay: 0.1s; }
        .stagger-in > *:nth-child(3) { animation-delay: 0.15s; }
        .stagger-in > *:nth-child(4) { animation-delay: 0.2s; }
        .stagger-in > *:nth-child(5) { animation-delay: 0.25s; }
        .stagger-in > *:nth-child(6) { animation-delay: 0.3s; }
        .stagger-in > *:nth-child(7) { animation-delay: 0.35s; }
        .stagger-in > *:nth-child(8) { animation-delay: 0.4s; }

        /* Vocabulary card flip feel */
        .vocab-reveal {
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .vocab-reveal:hover {
            background-color: var(--accent-muted);
        }

        /* ============================================
           MOBILE OPTIMIZATIONS
           ============================================ */

        /* Dynamic viewport height - accounts for mobile browser chrome */
        .h-dvh {
            height: 100vh; /* fallback */
            height: 100dvh;
        }

        /* Safe area utilities for notched devices */
        .safe-top    { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .safe-x      {
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Prevent text size adjustment on orientation change */
        html { -webkit-text-size-adjust: 100%; }

        /* Prevent 300ms tap delay */
        html { touch-action: manipulation; }

        @media (max-width: 640px) {
            body {
                overscroll-behavior: none;
            }

            /* Prevent iOS input zoom (inputs < 16px trigger zoom) */
            input, select, textarea {
                font-size: 16px !important;
            }

            /* Hide scrollbar on mobile (overlay scrollbars are native) */
            ::-webkit-scrollbar { width: 0; height: 0; }
        }

        /* ============================================
           ACCESSIBILITY
           ============================================ */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ============================================
           VOICE UI STYLES (Phase 17)
           ============================================ */

        /* Mic button recording state - red pulse */
        .voice-recording {
            background-color: var(--error) !important;
            color: white !important;
            animation: voicePulse 1.5s ease-in-out infinite;
        }

        @keyframes voicePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .voice-recording {
                animation: none !important;
                box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.5) !important;
            }
            .voice-bar {
                transition: none !important;
                height: 10px !important;
            }
            .voice-timer,
            .voice-processing-indicator {
                animation: none !important;
            }
            .voice-timer::before {
                animation: none !important;
            }
            .voice-spinner {
                animation-duration: 0.01ms !important;
            }
        }

        /* Interim transcript styling */
        .voice-interim {
            color: var(--text-subtle) !important;
            font-style: italic;
        }

        /* Speaker button states */
        .voice-speak-btn.voice-loading {
            opacity: 0.5;
            cursor: wait;
        }

        .voice-speak-btn.voice-playing {
            color: var(--accent);
        }

        /* Voice error tooltip */
        .voice-error-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--surface-elevated);
            color: var(--error, #ef4444);
            border: 1px solid var(--error, #ef4444);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            line-height: 1rem;
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 4px 12px var(--shadow-color);
            animation: tooltipFadeIn 0.2s ease-out;
        }

        .voice-error-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--error, #ef4444);
        }

        @keyframes tooltipFadeIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(4px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Audio level bars (replaces stop icon during recording) */
        .voice-level-bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            width: 20px;
            height: 20px;
        }

        .voice-bar {
            width: 3px;
            min-height: 3px;
            height: 3px;
            border-radius: 9999px;
            background-color: currentColor;
            transition: height 0.1s ease-out;
        }

        /* Recording timer pill */
        .voice-timer {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--error, #ef4444);
            color: white;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.675rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            line-height: 1.2;
            animation: tooltipFadeIn 0.2s ease-out;
        }

        .voice-timer::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: white;
            margin-right: 4px;
            vertical-align: middle;
            animation: voicePulse 1.5s ease-in-out infinite;
        }

        /* Processing spinner (replaces icon after recording stops) */
        .voice-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-subtle, #9ca3af);
            border-top-color: var(--accent, #60a5fa);
            border-radius: 50%;
            animation: voiceSpin 0.6s linear infinite;
        }

        @keyframes voiceSpin {
            to { transform: rotate(360deg); }
        }

        /* Processing text indicator */
        .voice-processing-indicator {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--surface-elevated, #374151);
            color: var(--text-muted, #9ca3af);
            border: 1px solid var(--border, #4b5563);
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.675rem;
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            animation: tooltipFadeIn 0.2s ease-out;
        }

        /* Floating TTS stop bar */
        .voice-stop-bar {
            display: flex;
            justify-content: center;
            padding: 8px 16px;
            background-color: var(--surface-elevated);
            border-top: 1px solid var(--border);
            animation: tooltipFadeIn 0.15s ease-out;
            flex-shrink: 0;
        }

        .voice-stop-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background-color: var(--error-muted);
            color: var(--error);
            border: 1px solid var(--error);
            border-radius: 999px;
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .voice-stop-btn:hover {
            background-color: var(--error);
            color: white;
        }

        .voice-stop-btn:active {
            transform: scale(0.97);
        }

        /* Recording bar (inline replacement for input during STT) */
        .voice-recording-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background-color: color-mix(in srgb, var(--error) 8%, var(--surface));
            border: 1px solid color-mix(in srgb, var(--error) 30%, var(--border));
            border-radius: 12px;
            width: 100%;
        }
        .voice-cancel-btn {
            flex-shrink: 0;
            padding: 6px;
            color: var(--text-subtle);
            border-radius: 50%;
            cursor: pointer;
            transition: color 0.15s ease, background-color 0.15s ease;
            background: none;
            border: none;
        }
        .voice-cancel-btn:hover {
            color: var(--error);
            background-color: color-mix(in srgb, var(--error) 10%, transparent);
        }
        .voice-rec-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--error);
            animation: voicePulse 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }
        .voice-rec-timer {
            font-size: 0.8125rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary, var(--text));
            min-width: 36px;
            flex-shrink: 0;
        }
        .voice-rec-waveform {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 2px;
            height: 28px;
            overflow: hidden;
        }
        .voice-rec-bar {
            width: 3px;
            min-height: 4px;
            border-radius: 9999px;
            background-color: var(--error);
            transition: height 0.08s ease-out;
            opacity: 0.7;
        }
        .voice-stop-square {
            background-color: var(--error) !important;
            color: white !important;
        }
        @media (prefers-reduced-motion: reduce) {
            .voice-rec-dot { animation: none; opacity: 0.8; }
            .voice-rec-bar { height: 12px !important; }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            :root {
                --border: #525252;
                --text-muted: #d6d3d1;
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="h-full antialiased font-sans" x-data="{
    theme: localStorage.getItem('hermano-theme') || 'azulejo',
    setTheme(newTheme) {
        this.theme = newTheme;
        localStorage.setItem('hermano-theme', newTheme);
        document.documentElement.setAttribute('data-theme', newTheme);
        document.body.classList.add('theme-transition');
        setTimeout(() => document.body.classList.remove('theme-transition'), 300);
    }
}" x-init="document.documentElement.setAttribute('data-theme', theme)">
    <div id="app" class="h-dvh flex flex-col">
        {% block content %}{% endblock %}
    </div>

    <!-- Custom JavaScript (ES Modules) -->
    <script nonce="{{ request.state.csp_nonce }}" type="module" src="{{ url_for('static', path='js/main.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
